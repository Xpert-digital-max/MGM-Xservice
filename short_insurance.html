<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนข้อมูลประกันภัยรถยนต์</title>
    <!-- LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- ดึงค่าตัวแปรจากไฟล์ config.js ของคุณ -->
    <script src="config.js"></script>
    <style>
        :root {
            --primary-color: #06C755;
            --primary-dark: #05b34c;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e4e9f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h2 {
            color: var(--text-color);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .header p {
            color: #8f9bb3;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: #222b45;
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            background-color: #f8fafc;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.1);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #8f9bb3;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>📝 ลงทะเบียนข้อมูลประกันภัย</h2>
            <p>กรอกข้อมูลรถยนต์ของท่านเพื่อให้ระบบบันทึกและแจ้งเตือน</p>
        </div>

        <form id="insuranceForm">
            <!-- 1. เลือกประเภทรถ -->
            <div class="form-group">
                <label for="carType">🚗 ประเภทรถ</label>
                <select id="carType" required>
                    <option value="" disabled selected>-- เลือกประเภทรถ --</option>
                    <option value="รถเก๋ง">รถเก๋ง</option>
                    <option value="รถกระบะ">รถกระบะ</option>
                    <option value="รถตู้">รถตู้</option>
                    <option value="รถไฟฟ้า">รถไฟฟ้า</option>
                    <option value="รถอื่นๆ">รถอื่นๆ</option>
                </select>
            </div>

            <!-- 2. ประเภทประกัน -->
            <div class="form-group">
                <label for="insuranceType">🛡️ ประเภทประกัน</label>
                <select id="insuranceType" required>
                    <option value="" disabled selected>-- เลือกประเภทประกัน --</option>
                    <option value="ประเภท 3">ประเภท 3</option>
                    <option value="ประเภท 3+">ประเภท 3+</option>
                    <option value="ประเภท 2+">ประเภท 2+</option>
                </select>
            </div>

            <!-- 3. ปีที่รถจดทะเบียน -->
            <div class="form-group">
                <label for="carYear">📅 ปีที่รถจดทะเบียน (พ.ศ. / ค.ศ.)</label>
                <input type="text" id="carYear" placeholder="เช่น 2565 หรือ 2022" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">บันทึกข้อมูล</button>
            <div id="loading">⏳ กำลังบันทึกข้อมูล กรุณารอสักครู่...</div>
        </form>
    </div>

    <script>
        let userProfile = null;

        window.onload = function() {
            // เรียกใช้ LIFF ID จากตัวแปร SHORT_INSURANCE_LIFF_ID ใน config.js
            initializeLiff(SHORT_INSURANCE_LIFF_ID);
        };

        function initializeLiff(liffId) {
            liff.init({
                liffId: liffId
            }).then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    liff.getProfile().then(profile => {
                        userProfile = profile;
                    }).catch(err => {
                        console.error('Error getting profile: ', err);
                    });
                }
            }).catch(err => {
                console.error('LIFF Initialization failed', err);
                alert('ไม่สามารถเชื่อมต่อระบบ LINE ได้ โปรดตรวจสอบ LIFF ID ใน config.js');
            });
        }

        document.getElementById('insuranceForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (!userProfile) {
                alert('⚠️ ไม่พบข้อมูลผู้ใช้ LINE กรุณาลองใหม่อีกครั้ง');
                return;
            }

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // ส่ง Action ชื่อ "saveShortInsurance" ไปยัง Code.gs
            const formData = {
                action: "saveShortInsurance", 
                userId: userProfile.userId,
                displayName: userProfile.displayName,
                pictureUrl: userProfile.pictureUrl || "",
                carType: document.getElementById('carType').value,
                insuranceType: document.getElementById('insuranceType').value,
                carYear: document.getElementById('carYear').value
            };

            // เรียกใช้ลิงก์ Web App จากตัวแปร GAS_API_URL ใน config.js
            fetch(GAS_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            }).then(() => {
                alert('✅ บันทึกข้อมูลสำเร็จเรียบร้อยแล้วครับ!');
                liff.closeWindow();
            }).catch(error => {
                console.error('Error!', error);
                alert('❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่');
                document.getElementById('submitBtn').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            });
        });
    </script>
</body>
</html>
