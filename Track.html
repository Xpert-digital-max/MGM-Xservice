<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดตามสถานะคิว</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f0f2f5; padding: 20px; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .container-box { width: 100%; max-width: 450px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .btn-green { background-color: #1DB446; color: white; font-weight: bold; }
    .btn-green:hover { background-color: #179b3b; color: white; }
    .status-card { border-left: 5px solid #1DB446; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="container-box">
    <h3 class="text-center text-success fw-bold mb-3">🔍 ตรวจสอบสถานะคิว</h3>
    <p class="text-center text-muted small mb-4">กรอกทะเบียนรถหรือเบอร์โทรศัพท์เพื่อเช็กสถานะงานของคุณ</p>

    <!-- ช่องค้นหา -->
    <div class="input-group mb-3">
      <input type="text" id="trackKeyword" class="form-control" placeholder="เลขทะเบียน หรือ เบอร์โทร...">
      <button class="btn btn-green" type="button" onclick="trackQueue()">ค้นหา</button>
    </div>

    <!-- ส่วนแสดงผลสถานะ -->
    <div id="trackResult" style="display: none;">
      <hr>
      <div id="queueList"></div>
    </div>
  </div>

  <script>
    // 🌟 ใส่ URL ของ Google Apps Script Web App ที่ลงท้ายด้วย /exec ตรงนี้
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyzFxHS2LMwdh0d2BvggdBiUMDY79wRQr_xfJLBUzo8RB9XbxPQIWaNe6S8PpvGeAJDmw/exec"; 

    async function trackQueue() {
      const keyword = document.getElementById('trackKeyword').value.trim();
      if(!keyword) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลสำหรับค้นหา', 'warning');

      Swal.fire({title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});

      try {
        const response = await fetch(GAS_API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "trackQueueStatus", keyword: keyword })
        });
        const res = await response.json();
        Swal.close();

        const resultDiv = document.getElementById('trackResult');
        const listDiv = document.getElementById('queueList');
        listDiv.innerHTML = '';

        if(res.status === "success" && res.data && res.data.length > 0) {
            resultDiv.style.display = 'block';
            
            res.data.forEach(item => {
                listDiv.innerHTML += `
                    <div class="status-card">
                      <p class="mb-1 text-muted small">สาขา: <strong>${item.branch}</strong></p>
                      <h5 class="fw-bold text-primary mb-1">คิวที่: ${item.queueNo}</h5>
                      <p class="mb-1">ทะเบียนรถ: <strong>${item.reg}</strong></p>
                      <p class="mb-0">สถานะ: <span class="badge bg-success">${item.status || 'กำลังดำเนินการ'}</span></p>
                    </div>
                `;
            });
        } else {
            resultDiv.style.display = 'block';
            listDiv.innerHTML = `<p class="text-center text-danger">❌ ไม่พบข้อมูลคิวที่ตรงกับข้อมูลนี้</p>`;
        }
      } catch(e) {
        Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
      }
    }
  </script>
</body>
</html>
