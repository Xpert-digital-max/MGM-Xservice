<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เช็คเบี้ยประกันรถยนต์ ฟรี</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script> 
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
    .container { background: white; width: 100%; max-width: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; padding-bottom: 30px;}
    
    .hero-header { background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); padding: 25px 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; border-bottom: 4px solid #1565c0;}
    .hero-header h2 { color: #0d47a1; margin: 0; font-size: 22px; font-weight: 700; }
    .hero-header h2 span { color: #f39c12; text-decoration: underline; }
    .hero-header p { color: #455a64; font-size: 14px; margin: 8px 0 0 0; }

    .form-content { padding: 20px; }
    .section-title { font-weight: 700; font-size: 16px; color: #1a237e; margin-bottom: 15px; text-align: center; }
    label.title-label { font-weight: 700; font-size: 15px; color: #37474f; display: block; margin: 20px 0 10px 0; }

    /* 🌟 ระบบปุ่มกดแบบใหม่ (Chips Option) */
    .chip-grid { display: grid; gap: 10px; margin-bottom: 10px; }
    .chip-grid.col-2 { grid-template-columns: 1fr 1fr; }
    .chip-grid.col-3 { grid-template-columns: 1fr 1fr 1fr; }
    
    .chip-btn {
        background: #fff; border: 1px solid #cfd8dc; border-radius: 8px; 
        padding: 12px 10px; text-align: center; font-size: 14px; color: #455a64; 
        cursor: pointer; transition: 0.2s; font-weight: 600; display: flex; 
        align-items: center; justify-content: center; min-height: 48px; line-height: 1.3;
    }
    .chip-btn:hover { background: #f8fbff; border-color: #90caf9; }
    .chip-btn.active { background: #e3f2fd; border-color: #1976d2; color: #1565c0; box-shadow: 0 2px 8px rgba(25,118,210,0.15); }
    .chip-btn input { display: none; }
    .chip-btn.has-icon { flex-direction: column; padding: 15px 5px; }
    .chip-icon { font-size: 30px; margin-bottom: 5px; }

    /* Input & Select ธรรมดา */
    input[type="text"], input[type="tel"], input[type="email"], input[type="date"], select { 
        width: 100%; padding: 14px 15px; margin-bottom: 10px; 
        border: 1px solid #cfd8dc; border-radius: 8px; box-sizing: border-box; 
        font-family: 'Sarabun', sans-serif; font-size: 15px; color: #263238; background: #fff; transition: 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15); }
    
    select {
        appearance: none; -webkit-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231976d2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat; background-position: right 15px center; background-size: 16px; cursor: pointer;
    }

    .divider { border-top: 2px dashed #eceff1; margin: 30px 0; }

    .btn-submit { 
        width: 100%; padding: 16px; border: none; border-radius: 12px; 
        background: linear-gradient(to right, #1e88e5, #1565c0); color: white; 
        font-weight: 700; font-family: 'Sarabun', sans-serif; font-size: 18px; 
        cursor: pointer; box-shadow: 0 4px 15px rgba(21, 101, 192, 0.3); transition: 0.3s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(21, 101, 192, 0.4); }
    
    #loadingScreen { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <h3 style="color:#1565c0;" id="loadingText">กำลังเตรียมระบบ... ⏳</h3>
  </div>

  <div class="container" id="appContainer" style="display:none;">
    <div class="hero-header">
      <h2>เช็คเบี้ยประกันรถยนต์ <span>ฟรี</span></h2>
      <p>และ ผ่อนได้ 0% คัดเบี้ยจากบริษัทชั้นนำมาให้แล้ว</p>
    </div>

    <form class="form-content" id="insuranceForm" onsubmit="submitInsurance(event)">
      
      <div class="section-title">วันนี้จะเช็คเบี้ยให้รถคันไหนครับ?</div>
      
      <!-- 1. เลือกชนิดรถ -->
      <div class="chip-grid col-2">
        <label class="chip-btn has-icon active" onclick="selectChip(this, 'carType')">
          <input type="radio" name="carType" value="รถเก๋ง / กระบะ 4 ประตู" checked>
          <span class="chip-icon">🚗</span> <span>รถเก๋ง / กระบะ 4 ประตู</span>
        </label>
        <label class="chip-btn has-icon" onclick="selectChip(this, 'carType')">
          <input type="radio" name="carType" value="กระบะ 2 ประตู">
          <span class="chip-icon">🛻</span> <span>กระบะ 2 ประตู</span>
        </label>
        <label class="chip-btn has-icon" onclick="selectChip(this, 'carType')">
          <input type="radio" name="carType" value="รถไฟฟ้า EV">
          <span class="chip-icon">⚡</span> <span>รถไฟฟ้า EV<br><small>(ไม่เกิน 7 ที่นั่ง)</small></span>
        </label>
        <label class="chip-btn has-icon" onclick="selectChip(this, 'carType')">
          <input type="radio" name="carType" value="รถตู้">
          <span class="chip-icon">🚐</span> <span>รถตู้</span>
        </label>
      </div>

      <!-- 2. ยี่ห้อรถ -->
      <label class="title-label">ยี่ห้อรถ</label>
      <input type="hidden" id="selectedBrand" value="">
      <div class="chip-grid col-3" id="brandOptions">
        <div class="chip-btn" onclick="selectBrandChip(this, 'TOYOTA')">TOYOTA</div>
        <div class="chip-btn" onclick="selectBrandChip(this, 'HONDA')">HONDA</div>
        <div class="chip-btn" onclick="selectBrandChip(this, 'ISUZU')">ISUZU</div>
        <div class="chip-btn" onclick="selectBrandChip(this, 'NISSAN')">NISSAN</div>
        <div class="chip-btn" onclick="selectBrandChip(this, 'MITSUBISHI')">MITSUBISHI</div>
        <div class="chip-btn" onclick="selectBrandChip(this, 'MAZDA')">MAZDA</div>
      </div>
      <select id="otherBrand" onchange="selectOtherBrand(this)">
        <option value="" disabled selected>ยี่ห้ออื่นๆ...</option>
        <option value="FORD">FORD</option>
        <option value="MG">MG</option>
        <option value="SUZUKI">SUZUKI</option>
        <option value="BYD">BYD (EV)</option>
        <option value="NETA">NETA (EV)</option>
        <option value="GWM">GWM (EV)</option>
        <option value="อื่นๆ">ยี่ห้ออื่นๆ นอกเหนือจากนี้</option>
      </select>

      <!-- 3. รุ่นรถ & รายละเอียด -->
      <label class="title-label">รายละเอียดรุ่นรถ</label>
      <input type="text" id="model" required placeholder="รุ่นรถ (เช่น CIVIC, D-MAX, YARIS)">
      <input type="text" id="subModel" placeholder="รายละเอียดรุ่น (เช่น 1.8 EL, 1.9 Ddi)">

      <!-- 4. ปีรถ & จังหวัด -->
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <div style="flex: 1;">
          <label class="title-label" style="margin-top:0;">ปีจดทะเบียน</label>
          <select id="year" required>
            <option value="" disabled selected>- ปีผลิต -</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label class="title-label" style="margin-top:0;">จังหวัดป้ายทะเบียน</label>
          <input type="text" id="province" required placeholder="เช่น กรุงเทพฯ">
        </div>
      </div>

      <!-- 5. การใช้รถ -->
      <label class="title-label">การใช้งาน</label>
      <div class="chip-grid col-2">
        <label class="chip-btn active" onclick="selectChip(this, 'usageType')">
          <input type="radio" name="usageType" value="ส่วนบุคคล (ไม่รับจ้าง)" checked> ใช้ส่วนตัว
        </label>
        <label class="chip-btn" onclick="selectChip(this, 'usageType')">
          <input type="radio" name="usageType" value="ใช้เชิงพาณิชย์ / รับจ้าง"> เชิงพาณิชย์/รับจ้าง
        </label>
      </div>

      <!-- 6. บริษัทประกันล่าสุด -->
      <label class="title-label">บริษัทประกันล่าสุดที่ใช้บริการอยู่</label>
      <input type="hidden" id="selectedIns" value="">
      <div class="chip-grid col-2" id="insOptions">
        <div class="chip-btn" onclick="selectInsChip(this, 'วิริยะประกันภัย')">วิริยะประกันภัย</div>
        <div class="chip-btn" onclick="selectInsChip(this, 'กรุงเทพประกันภัย')">กรุงเทพประกันภัย</div>
        <div class="chip-btn" onclick="selectInsChip(this, 'เมืองไทยประกันภัย')">เมืองไทยประกันภัย</div>
        <div class="chip-btn" onclick="selectInsChip(this, 'ทิพยประกันภัย')">ทิพยประกันภัย</div>
      </div>
      <select id="otherIns" onchange="selectOtherIns(this)">
        <option value="" disabled selected>บริษัทอื่นๆ / ไม่มีประกัน...</option>
        <option value="ไม่มีประกัน / ประกันขาด">ประกันหมดอายุ / ไม่มีประกัน</option>
        <option value="สินมั่นคงประกันภัย">สินมั่นคงประกันภัย</option>
        <option value="ธนชาตประกันภัย">ธนชาตประกันภัย</option>
        <option value="แอลเอ็มจีประกันภัย">แอลเอ็มจีประกันภัย (LMG)</option>
        <option value="อลิอันซ์ อยุธยา">อลิอันซ์ อยุธยา</option>
        <option value="บริษัทอื่นๆ">บริษัทอื่นๆ</option>
        <option value="จำไม่ได้">จำไม่ได้ / ไม่แน่ใจ</option>
      </select>

      <!-- 7. วันคุ้มครอง -->
      <label class="title-label">วันที่ต้องการให้คุ้มครอง</label>
      <input type="date" id="effectiveDate" required>

      <div class="divider"></div>

      <div class="section-title">ข้อมูลสำหรับจัดส่งแผนประกัน</div>

      <label class="title-label">ชื่อ - นามสกุล</label>
      <input type="text" id="customerName" required placeholder="ระบุชื่อของคุณ">

      <label class="title-label">เบอร์โทรศัพท์</label>
      <input type="tel" id="phone" required placeholder="08XXXXXXXX" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')">

      <label class="title-label">อีเมล (ถ้ามี)</label>
      <input type="email" id="email" placeholder="example@email.com">

      <button type="submit" id="btnSubmit" class="btn-submit">ดูแผนประกันเลย 🚀</button>
    </form>
  </div>

  <script>
    let lineUserId = "", lineDisplayName = "", linePicUrl = "";
    const MY_LIFF_ID = typeof INSURANCE_LIFF_ID !== 'undefined' ? INSURANCE_LIFF_ID : "";

    window.onload = async function() {
        populateYears();
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('effectiveDate').setAttribute('min', today);

        try {
            if(!MY_LIFF_ID) throw new Error("ไม่พบ INSURANCE_LIFF_ID ใน config.js");
            await liff.init({ liffId: MY_LIFF_ID });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                lineUserId = profile.userId;
                lineDisplayName = profile.displayName;
                linePicUrl = profile.pictureUrl || "";
                
                // ดึงชื่อ LINE มากรอกอัตโนมัติ (ถ้าต้องการ)
                document.getElementById('customerName').value = lineDisplayName;
                
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
            } else {
                liff.login();
            }
        } catch(err) {
            Swal.fire("ข้อผิดพลาด", "ไม่สามารถเชื่อมต่อ LINE ได้: " + err.message, "error");
        }
    };

    // 🌟 ฟังก์ชันจัดการปุ่มกด (Radio Chip)
    function selectChip(element, groupName) {
        document.querySelectorAll(`input[name="${groupName}"]`).forEach(input => {
            input.parentElement.classList.remove('active');
        });
        element.classList.add('active');
        element.querySelector('input').checked = true;
    }

    // 🌟 ฟังก์ชันจัดการปุ่ม ยี่ห้อรถ
    function selectBrandChip(element, val) {
        document.querySelectorAll('#brandOptions .chip-btn').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('selectedBrand').value = val;
        document.getElementById('otherBrand').value = ""; // รีเซ็ต Dropdown
    }
    function selectOtherBrand(sel) {
        document.querySelectorAll('#brandOptions .chip-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('selectedBrand').value = sel.value;
    }

    // 🌟 ฟังก์ชันจัดการปุ่ม บริษัทประกัน
    function selectInsChip(element, val) {
        document.querySelectorAll('#insOptions .chip-btn').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('selectedIns').value = val;
        document.getElementById('otherIns').value = ""; // รีเซ็ต Dropdown
    }
    function selectOtherIns(sel) {
        document.querySelectorAll('#insOptions .chip-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('selectedIns').value = sel.value;
    }

    function populateYears() {
        const yearSelect = document.getElementById("year");
        const currentYear = new Date().getFullYear();
        for (let i = currentYear; i >= currentYear - 20; i--) {
            let option = document.createElement("option");
            option.value = i;
            option.text = `${i} (${i + 543})`;
            yearSelect.appendChild(option);
        }
    }

    function submitInsurance(event) {
      event.preventDefault();
      
      const phone = document.getElementById("phone").value;
      if (!phone.startsWith("0") || phone.length < 9) {
          return Swal.fire("เบอร์โทรไม่ถูกต้อง", "กรุณาใส่เลข 0 นำหน้า และกรอกให้ครบ 10 หลัก", "warning");
      }

      // เช็คค่าที่กดจากปุ่ม (ยี่ห้อ & ประกันเดิม)
      const brandVal = document.getElementById("selectedBrand").value;
      if(!brandVal) return Swal.fire("ข้อมูลไม่ครบ", "กรุณาเลือกยี่ห้อรถยนต์", "warning");

      const insVal = document.getElementById("selectedIns").value;
      if(!insVal) return Swal.fire("ข้อมูลไม่ครบ", "กรุณาเลือกบริษัทประกันล่าสุด (ถ้าไม่มีให้เลือกช่องอื่นๆ)", "warning");

      const btn = document.getElementById("btnSubmit");
      btn.innerText = "กำลังคำนวณแผนประกัน... ⏳";
      btn.disabled = true;

      const payload = {
         action: "saveInsuranceCheck",
         carType: document.querySelector('input[name="carType"]:checked').value,
         brand: brandVal,
         model: document.getElementById("model").value,
         subModel: document.getElementById("subModel").value,
         year: document.getElementById("year").value,
         province: document.getElementById("province").value,
         usage: document.querySelector('input[name="usageType"]:checked').value,
         currentIns: insVal,
         effectiveDate: document.getElementById("effectiveDate").value,
         customerName: document.getElementById("customerName").value,
         phone: phone,
         email: document.getElementById("email").value,
         userId: lineUserId,
         displayName: lineDisplayName,
         pictureUrl: linePicUrl
      };

      fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
          if (data.status === "success") {
              Swal.fire({
                 title: "ได้รับข้อมูลเรียบร้อย!",
                 text: "โปรดรอสักครู่ ระบบกำลังเตรียมสร้างใบเสนอราคา และแอดมินจะแจ้งกลับทาง LINE ทันทีครับ",
                 icon: "success",
                 confirmButtonColor: "#1565c0"
              }).then(() => {
                 liff.closeWindow();
              });
          } else {
              throw new Error("Save failed");
          }
      })
      .catch(err => {
          btn.innerText = "ดูแผนประกันเลย 🚀";
          btn.disabled = false;
          Swal.fire("ข้อผิดพลาด", "ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่", "error");
      });
    }
  </script>
</body>
</html>
