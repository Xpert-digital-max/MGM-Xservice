<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - จัดทำใบเสนอราคา</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script> 
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
    .container { background: white; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding-bottom: 30px;}
    
    .header { background: #1565c0; color: white; padding: 20px; text-align: center; }
    .header h2 { margin: 0; font-size: 22px; }
    .header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }

    .content { padding: 20px; }
    
    .info-card { background: #e3f2fd; border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 4px solid #1976d2; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; color: #37474f; }
    .info-row strong { color: #1565c0; }
    .btn-view-img { display: inline-block; background: #fff; color: #1976d2; border: 1px solid #1976d2; padding: 6px 12px; border-radius: 6px; font-size: 13px; text-decoration: none; font-weight: bold; margin-top: 10px; }

    label { font-weight: 600; font-size: 15px; color: #333; display: block; margin: 15px 0 5px 0; }
    input[type="number"] { 
        width: 100%; padding: 12px 15px; border: 1px solid #cfd8dc; border-radius: 8px; 
        font-family: 'Sarabun', sans-serif; font-size: 16px; box-sizing: border-box; background: #fff;
    }
    input[type="number"]:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 2px rgba(25,118,210,0.2); }

    .total-box { background: #fff3e0; border: 2px dashed #f57c00; padding: 15px; text-align: center; border-radius: 10px; margin-top: 20px; }
    .total-box span { font-size: 16px; color: #e65100; font-weight: bold; }
    .total-box h3 { margin: 5px 0 0 0; font-size: 28px; color: #d84315; }

    .btn-submit { width: 100%; padding: 16px; margin-top: 20px; border: none; border-radius: 10px; background: #2e7d32; color: white; font-weight: bold; font-family: 'Sarabun', sans-serif; font-size: 18px; cursor: pointer; box-shadow: 0 4px 10px rgba(46,125,50,0.3); }
    .btn-submit:disabled { background: #9e9e9e; cursor: not-allowed; box-shadow: none; }
    
    #loadingScreen { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <h3 style="color:#1565c0;" id="loadingText">กำลังดึงข้อมูล... ⏳</h3>
  </div>

  <div class="container" id="appContainer" style="display:none;">
    <div class="header">
      <h2>📝 จัดทำใบเสนอราคา</h2>
      <p id="qtIdDisplay">รหัสอ้างอิง: -</p>
    </div>

    <div class="content">
      <!-- ข้อมูลลูกค้าและรถ -->
      <div class="info-card">
        <div class="info-row"><span>ลูกค้า:</span> <strong id="lblCustomerName">-</strong></div>
        <div class="info-row"><span>เบอร์โทร:</span> <strong id="lblPhone">-</strong></div>
        <div class="info-row"><span>ประเภทรถ:</span> <strong id="lblCarType">-</strong></div>
        <div class="info-row"><span>ทะเบียนรถ:</span> <strong id="lblCarReg">-</strong></div>
        <div class="info-row"><span>ประกันที่สนใจ:</span> <strong id="lblInsType">-</strong></div>
        <a href="#" id="btnViewDoc" target="_blank" class="btn-view-img" style="display:none;">📄 กดดูรูปสำเนารถ</a>
      </div>

      <form id="adminQuoteForm" onsubmit="submitAdminQuotation(event)">
        <!-- เก็บค่าที่ซ่อนไว้ -->
        <input type="hidden" id="hidQtId">
        <input type="hidden" id="hidUserId">

        <label>1. ค่าตรวจสภาพ (ตรอ.)</label>
        <input type="number" id="priceInspect" placeholder="0" oninput="calculateTotal()">

        <label>2. ค่า พ.ร.บ.</label>
        <input type="number" id="pricePrb" placeholder="0" oninput="calculateTotal()">

        <label>3. ค่าภาษี + ค่าปรับ (ถ้ามี)</label>
        <input type="number" id="priceTax" placeholder="0" oninput="calculateTotal()">

        <label>4. ค่าบริการ</label>
        <input type="number" id="priceService" placeholder="0" oninput="calculateTotal()">

        <label>5. ค่าเบี้ยประกันภัย (ถ้ามี)</label>
        <input type="number" id="priceIns" placeholder="0" oninput="calculateTotal()">

        <div class="total-box">
          <span>ยอดชำระสุทธิ (บาท)</span>
          <h3 id="txtTotal">0</h3>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">ส่งใบเสนอราคาให้ลูกค้า 🚀</button>
      </form>
    </div>
  </div>

  <script>
    let currentTotal = 0;
    // สร้างตัวแปร LIFF ID สำหรับหน้า Admin (อย่าลืมไปสร้างและเพิ่มใน config.js นะครับ)
    const ADMIN_QT_LIFF_ID = typeof ADMIN_QUOTATION_LIFF_ID !== 'undefined' ? ADMIN_QUOTATION_LIFF_ID : "";

    document.addEventListener("DOMContentLoaded", async function() {
        try {
            if(!ADMIN_QT_LIFF_ID) throw new Error("ไม่พบ ADMIN_QUOTATION_LIFF_ID ใน config.js");
            await liff.init({ liffId: ADMIN_QT_LIFF_ID });
            
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            // อ่านรหัส qtId จาก URL parameter (ที่แนบมาจากปุ่มในกลุ่ม LINE)
            const urlParams = new URLSearchParams(window.location.search);
            const qtId = urlParams.get('qtId');

            if (!qtId) {
                throw new Error("ไม่พบรหัสใบเสนอราคา (qtId) กรุณาเข้าผ่านลิงก์ในกลุ่ม LINE");
            }

            document.getElementById('qtIdDisplay').innerText = "รหัสอ้างอิง: " + qtId;
            document.getElementById('hidQtId').value = qtId;

            // ดึงข้อมูลรถจาก Google Sheets มาแสดง
            fetchQuotationData(qtId);

        } catch(err) {
            document.getElementById('loadingText').innerHTML = "❌ " + err.message;
            document.getElementById('loadingText').style.color = "red";
            Swal.fire("ข้อผิดพลาด", err.message, "error");
        }
    });

    function fetchQuotationData(qtId) {
        // ยิงไปหา Code.gs เพื่อขอข้อมูลแถวที่มี qtId นี้
        fetch(GAS_API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "getQuotationDataByQtId", qtId: qtId })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                const info = data.data;
                document.getElementById('lblCustomerName').innerText = info.displayName;
                document.getElementById('lblPhone').innerText = info.phone;
                document.getElementById('lblCarType').innerText = info.carType;
                document.getElementById('lblCarReg').innerText = info.carReg;
                document.getElementById('lblInsType').innerText = info.insuranceType;
                document.getElementById('hidUserId').value = info.userId;
                
                if(info.docLink) {
                    const btnDoc = document.getElementById('btnViewDoc');
                    btnDoc.href = info.docLink;
                    btnDoc.style.display = "inline-block";
                }

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
            } else {
                throw new Error("ไม่พบข้อมูลใบเสนอราคารหัส " + qtId);
            }
        })
        .catch(err => {
            document.getElementById('loadingText').innerHTML = "❌ " + err.message;
            document.getElementById('loadingText').style.color = "red";
            Swal.fire("ข้อผิดพลาด", err.message, "error");
        });
    }

    function calculateTotal() {
        const inspect = parseFloat(document.getElementById('priceInspect').value) || 0;
        const prb = parseFloat(document.getElementById('pricePrb').value) || 0;
        const tax = parseFloat(document.getElementById('priceTax').value) || 0;
        const service = parseFloat(document.getElementById('priceService').value) || 0;
        const ins = parseFloat(document.getElementById('priceIns').value) || 0;
        
        currentTotal = inspect + prb + tax + service + ins;
        
        // ใส่คอมม่าให้ตัวเลขสวยงาม
        document.getElementById('txtTotal').innerText = currentTotal.toLocaleString('en-US');
    }

    function submitAdminQuotation(event) {
        event.preventDefault();
        
        if (currentTotal <= 0) {
            return Swal.fire("แจ้งเตือน", "กรุณากรอกราคาอย่างน้อย 1 รายการ", "warning");
        }

        const btn = document.getElementById("btnSubmit");
        btn.innerHTML = "กำลังส่งใบเสนอราคา... ⏳";
        btn.disabled = true;

        const payload = {
            action: "sendQuotationToCustomer",
            qtId: document.getElementById('hidQtId').value,
            userId: document.getElementById('hidUserId').value,
            carReg: document.getElementById('lblCarReg').innerText,
            carType: document.getElementById('lblCarType').innerText,
            priceInspect: parseFloat(document.getElementById('priceInspect').value) || 0,
            pricePrb: parseFloat(document.getElementById('pricePrb').value) || 0,
            priceTax: parseFloat(document.getElementById('priceTax').value) || 0,
            priceService: parseFloat(document.getElementById('priceService').value) || 0,
            priceIns: parseFloat(document.getElementById('priceIns').value) || 0,
            totalPrice: currentTotal
        };

        fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                Swal.fire({
                    title: "ส่งสำเร็จ!",
                    text: "ส่งใบเสนอราคาให้ลูกค้าเรียบร้อยแล้ว",
                    icon: "success",
                    confirmButtonText: "ตกลง"
                }).then(() => {
                    liff.closeWindow();
                });
            } else { throw new Error(data.message); }
        })
        .catch(err => {
            btn.innerHTML = "ส่งใบเสนอราคาให้ลูกค้า 🚀";
            btn.disabled = false;
            // กรณีติด CORS no-cors ปิดหน้าต่างไปเลย
            liff.closeWindow();
        });
    }
  </script>
</body>
</html>
