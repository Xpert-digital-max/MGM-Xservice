<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตรวจสอบข้อมูล & รับสิทธิ์</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f0f2f5; padding: 20px; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .container-box { width: 100%; max-width: 450px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .btn-green { background-color: #1DB446; color: white; font-weight: bold; }
  </style>
</head>
<body>

  <!-- หน้าจอที่ 1: ปุ่มยืนยัน -->
  <div class="container-box" id="formSection">
    <h4 class="text-center mb-3 text-dark fw-bold">🔍 ยืนยันการรับคิวงาน</h4>
    <p class="text-center text-muted small mb-4">ระบบได้เตรียมข้อมูลของคุณไว้แล้ว<br>กรุณากดปุ่มด้านล่างเพื่อรับการแจ้งเตือนทันที</p>

    <div class="alert alert-light border mb-4 text-center">
        <div class="small text-muted mb-1">เบอร์โทรศัพท์</div>
        <div id="displayTel" class="fw-bold fs-5 text-primary">-</div>
        <hr class="my-2">
        <div class="small text-muted mb-1">ทะเบียนรถ</div>
        <div id="displayReg" class="fw-bold fs-5 text-dark">-</div>
    </div>

    <button class="btn btn-green w-100 btn-lg shadow-sm rounded-pill" id="submitBtn" onclick="triggerBotPush()">กดยืนยันตรวจสอบคิว</button>
  </div>

  <!-- หน้าจอที่ 2: หน้าสำเร็จ (ตัดปัญหาเรื่องหมุนค้าง และจบแค่หน้านี้ตามที่คุณต้องการ) -->
  <div class="container-box text-center" id="successSection" style="display:none;">
    <div class="mb-3"><span style="font-size: 3.5rem;">✨</span></div>
    <h4 class="text-success fw-bold mb-2">ส่งข้อมูลสำเร็จ</h4>
    <p class="text-muted small mb-4">กรุณากดปิดหน้าต่างนี้เพื่อกลับสู่ช่องแชท<br>ระบบได้จัดส่งรายละเอียดให้ท่านเรียบร้อยแล้ว</p>
    <button class="btn btn-outline-secondary w-100 rounded-pill mt-4" onclick="returnToChat()">ปิดเพื่อกลับสู่หน้าแชท</button>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    let globalRefId = "";
    let qTel = "";
    let qReg = "";
    let qType = "";

    window.onload = async () => {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "กำลังเชื่อมต่อระบบ LINE...";

      const urlParams = new URLSearchParams(window.location.search);
      globalRefId = urlParams.get('refId') || "";
      qTel = urlParams.get('tel') || "ไม่ระบุเบอร์";
      qReg = urlParams.get('reg') || "ไม่ระบุทะเบียน";
      qType = urlParams.get('type') || "ไม่ระบุประเภท";

      document.getElementById('displayTel').innerText = qTel;
      document.getElementById('displayReg').innerText = qReg;

      try {
        await liff.init({ liffId: REGISTER_LIFF_ID }); 
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          btn.disabled = false;
          btn.innerText = "กดยืนยันตรวจสอบคิว";
        }
      } catch (err) {
        btn.innerText = "การเชื่อมต่อล้มเหลว";
      }
    };

    async function triggerBotPush() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังส่งข้อมูล...'; 

      try {
          if (!liff.isLoggedIn()) {
              liff.login();
              return;
          }

          const profile = await liff.getProfile();

          // ส่งข้อมูลไปให้หลังบ้าน (Code.gs) ทำการ Push ข้อความชุดเดียวจบ
          const payload = {
              action: "confirmQueueAndPush",
              phone: qTel,
              reg: qReg,
              type: qType,
              userId: profile.userId,
              displayName: profile.displayName,
              refId: globalRefId
          };

          // ยิง API แบบไม่รอผลลัพธ์นาน เพื่อป้องกันหน้าจอหมุนค้าง
          fetch(GAS_API_URL, {
              method: 'POST',
              body: JSON.stringify(payload)
          }).catch(err => console.log(err));

          // ตัดมาแสดงหน้าจอสำเร็จทันทีแบบสมูท ไม่ต้องรอ
          document.getElementById('formSection').style.display = 'none';
          document.getElementById('successSection').style.display = 'block';

      } catch (err) {
          Swal.fire('ข้อผิดพลาด', 'ไม่สามารถส่งข้อมูลได้: ' + err.message, 'error');
          btn.disabled = false; 
          btn.innerText = "กดยืนยันตรวจสอบคิว";
      }
    }

    // 🌟 ฟังก์ชันบังคับเปิดห้องแชทของร้านโดยตรง (ใส่ ID ร้านของคุณที่นี่)
    function returnToChat() {
      // ⚠️ เปลี่ยน @YOUR_OA_ID เป็น LINE ID ของร้านคุณจริงๆ (เช่น @mr.xservice)
      window.location.href = "https://line.me/R/ti/p/@xservice"; 
      
      setTimeout(() => { 
          liff.closeWindow(); 
      }, 500);
    }
  </script>
</body>
</html>
