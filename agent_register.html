<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนตัวแทนพาร์ทเนอร์</title>
    
    <!-- Bootstrap & Tailwind สำหรับความสวยงาม -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SweetAlert2 & LINE LIFF -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <!-- 🌟 ดึงตัวแปรจาก config.js ของคุณ -->
    <script src="config.js"></script>

    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container-box { width: 100%; max-width: 450px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .bg-premium { background: linear-gradient(135deg, #1A365D 0%, #2A4365 100%); }
        .btn-premium { background-color: #1A365D; color: white; font-weight: bold; transition: 0.3s; }
        .btn-premium:hover { background-color: #12284C; color: white; }
    </style>
</head>
<body>

    <div class="container-box">
        <!-- ส่วนหัว -->
        <div class="bg-premium p-4 text-center text-white">
            <h4 class="fw-bold mb-1">สมัครตัวแทนพาร์ทเนอร์</h4>
            <p class="small mb-0" style="color: #cbd5e1;">กรอกข้อมูลเพื่อรับสิทธิประโยชน์ที่คุ้มค่ากว่า</p>
        </div>

        <!-- ฟอร์มรับสมัคร -->
        <form id="agentForm" class="p-4 space-y-4">
            
            <div class="d-flex justify-content-center mb-3">
                <img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="rounded-circle border shadow-sm" style="width: 80px; height: 80px; object-fit: cover;" alt="Profile">
            </div>

            <div>
                <label class="form-label small fw-bold text-secondary mb-1">ชื่อ - นามสกุล (จริง)</label>
                <input type="text" id="fullName" required class="form-control" placeholder="ระบุชื่อและนามสกุล">
            </div>
            
            <div>
                <label class="form-label small fw-bold text-secondary mb-1">ชื่อเล่น</label>
                <input type="text" id="nickname" required class="form-control" placeholder="ระบุชื่อเล่น">
            </div>

            <div>
                <label class="form-label small fw-bold text-secondary mb-1">เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" required pattern="[0-9]{10}" class="form-control" placeholder="08XXXXXXXX" maxlength="10">
            </div>

            <button type="submit" id="submitBtn" class="btn btn-premium w-100 btn-lg rounded-pill mt-4 shadow-sm">
                ยืนยันการสมัคร
            </button>
        </form>
    </div>

    <script>
        // 🌟 1. ใส่ LIFF ID สำหรับหน้าสมัครตัวแทน (สร้างใหม่จาก LINE Developers)
        const AGENT_LIFF_ID = "ใส่_LIFF_ID_สมัครตัวแทนตรงนี้"; 
        
        let lineProfile = {};

        // เริ่มต้นการทำงานของ LIFF
        window.onload = () => {
            liff.init({ liffId: AGENT_LIFF_ID }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        lineProfile = profile;
                        document.getElementById('profileImage').src = profile.pictureUrl || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
                    });
                } else {
                    liff.login();
                }
            }).catch(err => {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อ LINE ได้', 'error');
            });
        };

        // จัดการเมื่อกดปุ่มยืนยัน
        document.getElementById('agentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if(!lineProfile.userId) {
                return Swal.fire('กรุณารอสักครู่', 'กำลังโหลดข้อมูลจาก LINE', 'warning');
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึกข้อมูล...';

            // เตรียมข้อมูลส่งไปหา Google Apps Script
            const payload = {
                action: "submitAgentRegistration",
                userId: lineProfile.userId,
                displayName: lineProfile.displayName,
                pictureUrl: lineProfile.pictureUrl,
                fullName: document.getElementById('fullName').value,
                nickname: document.getElementById('nickname').value,
                phone: document.getElementById('phone').value
            };

            try {
                // GAS_API_URL ดึงมาจากไฟล์ config.js ของคุณ
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if(result.status === "success") {
                    Swal.fire({
                        icon: 'success',
                        title: 'สมัครสำเร็จ!',
                        text: 'ระบบได้ส่งข้อมูลรหัสตัวแทนให้คุณทางแชทเรียบร้อยแล้ว',
                        confirmButtonText: 'ปิดหน้าต่าง',
                        confirmButtonColor: '#1A365D'
                    }).then(() => {
                        liff.closeWindow();
                    });
                } else {
                    Swal.fire('แจ้งเตือน', result.message, 'warning');
                    btn.disabled = false;
                    btn.innerText = "ยืนยันการสมัคร";
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อระบบหลังบ้านได้', 'error');
                btn.disabled = false;
                btn.innerText = "ยืนยันการสมัคร";
            }
        });
    </script>
</body>
</html>
