<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนตัวแทน - มิสเตอร์เอ็กซ์ Group</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- 🌟 ดึงค่า URL กลางจาก config.js -->
  <script src="config.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-900 to-blue-600">
  
  <div class="w-full max-w-md glass-card rounded-2xl shadow-2xl p-8 relative overflow-hidden">
    <div class="text-center mb-6">
      <h1 class="text-4xl font-bold text-blue-900 mb-2">มิสเตอร์เอ็กซ์ Group</h1>
      <p class="text-gray-600 font-medium">ระบบบริหารจัดการตัวแทนพาร์ทเนอร์</p>
    </div>

    <!-- ส่วน Loading -->
    <div id="loadingSection" class="text-center py-10">
      <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-blue-600 mx-auto mb-4"></div>
      <p class="text-gray-600">กำลังตรวจสอบข้อมูล...</p>
    </div>

    <!-- ส่วนแสดงสถานะ (กรณีสมัครแล้ว -> บังคับโชว์ปุ่มไปหน้าใบเสนอราคา) -->
    <div id="statusSection" class="hidden text-center py-6">
      <div id="statusIcon" class="text-6xl mb-4">✅</div>
      <h2 id="statusTitle" class="text-2xl font-bold mb-2 text-green-600">ลงทะเบียนในระบบแล้ว</h2>
      <p id="statusDesc" class="text-gray-600 mb-6">คุณได้ลงทะเบียนเป็นพาร์ทเนอร์เรียบร้อยแล้วครับ สามารถเข้าใช้งานระบบออกใบเสนอราคาได้ทันที</p>
      
      <div class="bg-gray-50 p-4 rounded-xl border text-left mb-6 shadow-inner">
        <p class="text-sm text-gray-500 mb-1">รหัสตัวแทนของคุณ:</p>
        <p id="agentCodeDisplay" class="text-xl font-bold text-blue-800">-</p>
        <p id="agentNameDisplay" class="text-md text-gray-700 mt-1">-</p>
      </div>

      <!-- 🟢 ปุ่มกดเด้งไปหน้าใบเสนอราคา -->
      <div id="actionButtons" class="flex flex-col gap-3">
        <button onclick="goToQuotation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center">
          <span class="mr-2">📄</span> ไปหน้าออกใบเสนอราคา
        </button>
        <button onclick="liff.closeWindow()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 rounded-xl transition">
          ปิดหน้าต่าง
        </button>
      </div>
    </div>

    <!-- ส่วนฟอร์มลงทะเบียน (กรณียังไม่สมัคร) -->
    <div id="registerSection" class="hidden">
      <div class="bg-blue-50 border-l-4 border-blue-500 p-3 mb-6 rounded-r">
        <p class="text-sm text-blue-800">กรุณากรอกข้อมูลเพื่อลงทะเบียนเข้าร่วมเป็นพาร์ทเนอร์</p>
      </div>

      <form id="registerForm" onsubmit="submitRegistration(event)">
        <div class="mb-4">
          <label class="block text-gray-700 font-semibold mb-2">ชื่อ - นามสกุล (จริง) *</label>
          <input type="text" id="fullName" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="เช่น สมชาย ใจดี">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-semibold mb-2">ชื่อเล่น *</label>
          <input type="text" id="nickname" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="เช่น ชาย">
        </div>
        <div class="mb-6">
          <label class="block text-gray-700 font-semibold mb-2">เบอร์โทรศัพท์ *</label>
          <input type="tel" id="phone" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required placeholder="เช่น 0812345678" pattern="[0-9]{9,10}" maxlength="10">
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-700 hover:to-blue-900 text-white font-bold py-3 rounded-xl shadow-lg transition transform hover:scale-[1.02]">
          📝 ยืนยันการลงทะเบียน
        </button>
      </form>
    </div>
  </div>

  <script>
    let userProfile = {};
    let refUserId = "";

    window.onload = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      refUserId = urlParams.get('ref') || "";

      try {
        // 🌟 เรียกใช้ AGENT_LIFF_ID จาก config.js
        await liff.init({ liffId: AGENT_LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        userProfile = await liff.getProfile();
        checkStatus(userProfile.userId); 
      } catch (err) {
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถโหลดระบบ LINE ได้', 'error');
      }
    };

    // ฟังก์ชันตรวจสอบสถานะตัวแทน
    function checkStatus(userId) {
      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "checkAgentStatus", userId: userId })
      })
      .then(res => res.json())
      .then(res => {
        document.getElementById('loadingSection').classList.add('hidden');
        
        // 🌟 เช็คให้ชัวร์ว่าลงทะเบียนแล้วจริงๆ (รองรับค่า true หรือมี agentCode กลับมา)
        if (res.isRegistered === true || (res.agentCode && res.agentCode !== "")) {
          // เคยลงทะเบียนแล้ว -> ซ่อนฟอร์ม โชว์การ์ดข้อมูลและปุ่มไปหน้าใบเสนอราคา
          document.getElementById('statusSection').classList.remove('hidden');
          document.getElementById('agentCodeDisplay').innerText = res.agentCode || "มีรหัสในระบบแล้ว";
          document.getElementById('agentNameDisplay').innerText = res.fullName || userProfile.displayName;
        } else {
          // ยังไม่เคยลงทะเบียน -> โชว์ฟอร์มกรอกข้อมูล
          document.getElementById('registerSection').classList.remove('hidden');
        }
      })
      .catch(err => {
        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('registerSection').classList.remove('hidden');
      });
    }

    // ฟังก์ชันกดปุ่มเด้งไปหน้าใบเสนอราคา
    function goToQuotation() {
      if (typeof QUOTATION_LIFF_ID !== 'undefined') {
        window.location.href = "https://liff.line.me/" + QUOTATION_LIFF_ID;
      } else {
        Swal.fire('แจ้งเตือน', 'ยังไม่ได้กำหนดลิงก์ใบเสนอราคาในระบบ', 'warning');
      }
    }

    // ฟังก์ชันส่งข้อมูลลงทะเบียนใหม่
    function submitRegistration(e) {
      e.preventDefault();
      
      let rawPhone = document.getElementById('phone').value.trim();
      if (rawPhone.length === 9 && !rawPhone.startsWith('0')) {
        rawPhone = '0' + rawPhone;
      }

      const data = {
        fullName: document.getElementById('fullName').value.trim(),
        nickname: document.getElementById('nickname').value.trim(),
        phone: rawPhone,
        userId: userProfile.userId,
        displayName: userProfile.displayName,
        pictureUrl: userProfile.pictureUrl || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png",
        refUserId: refUserId
      };

      Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "registerAgent", data: data })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success || res.status === "success") {
          const code = res.agentCode || "สำเร็จ";
          Swal.fire({
            icon: 'success', title: 'ลงทะเบียนสำเร็จ!',
            text: `รหัสตัวแทนของคุณคือ ${code} ระบบได้บันทึกข้อมูลเรียบร้อยแล้ว`,
            confirmButtonText: 'ไปหน้าออกใบเสนอราคา'
          }).then(() => { 
            goToQuotation(); 
          });
        } else {
          Swal.fire('ผิดพลาด', res.error || res.message || 'เกิดข้อผิดพลาด', 'error');
        }
      })
      .catch(err => Swal.fire('ข้อผิดพลาด', 'เชื่อมต่อระบบล้มเหลว', 'error'));
    }
  </script>
</body>
</html>
