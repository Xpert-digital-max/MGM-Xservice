<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คัดลอกรายละเอียด</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md border-t-4 border-blue-600">
    <h2 class="text-xl font-bold text-blue-900 mb-4 flex items-center">
      <span class="mr-2">📋</span> รายละเอียดการรับบริการ
    </h2>
    
    <textarea id="infoText" rows="16" class="w-full p-4 border border-gray-300 rounded-lg mb-4 bg-gray-50 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-sm leading-relaxed" readonly></textarea>
    
    <button onclick="copyToClipboard()" id="copyBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition shadow flex items-center justify-center">
      <span class="mr-2">✂️</span> กดเพื่อคัดลอกข้อความ
    </button>
  </div>

  <script>
    function fmt(numStr) {
        let n = Number(numStr);
        if (!n || n <= 0) return 0;
        return n.toLocaleString();
    }

    const params = new URLSearchParams(window.location.search);
    const d = params.get('d') || '-';
    const p = params.get('p') || '-';
    const c = params.get('c') || '-';
    const t = params.get('t') || '-';
    const w = params.get('w') || '-';
    const r = params.get('r') || '-';
    const a = params.get('a') || '-';
    const i = params.get('i') || '-';
    
    const prb = Number(params.get('prb') || 0);
    const tor = Number(params.get('tor') || 0);
    const tax = Number(params.get('tax') || 0);
    const fine = Number(params.get('fine') || 0);
    const fee = Number(params.get('fee') || 0);
    const ins = Number(params.get('ins') || 0);
    const tot = Number(params.get('tot') || 0);
    const dep = Number(params.get('dep') || 0);
    const l = params.get('l') || '-';

    // ดึงรายการมาแสดง
    let breakdown = "";
    if (prb > 0) breakdown += "พ.ร.บ.: " + fmt(prb) + " บ.\n";
    if (tor > 0) breakdown += "ตรวจ: " + fmt(tor) + " บ.\n";
    if (tax > 0) breakdown += "ภาษี: " + fmt(tax) + " บ.\n";
    if (fine > 0) breakdown += "ปรับ: " + fmt(fine) + " บ.\n";
    if (fee > 0) breakdown += "ค่าบริการ: " + fmt(fee) + " บ.\n";
    if (ins > 0) breakdown += "ประกัน (" + i + "): " + fmt(ins) + " บ.\n";

    // จัดการยอดมัดจำและเปลี่ยนคำว่า "สุทธิรวมทั้งสิ้น" เป็น "รวม"
    let totalText = "";
    if (dep > 0) {
        totalText = "รวมยอดสุทธิเต็ม: " + fmt(tot) + " บ.\n" +
                    "หักมัดจำล่วงหน้า: -" + fmt(dep) + " บ.\n" +
                    "ยอดคงเหลือค้างชำระ: " + fmt(tot - dep) + " บ.";
    } else {
        totalText = "รวม: " + fmt(tot) + " บาท";
    }

    // 🌟 นำหัวข้อและ Job ID ออกตามที่คุณต้องการ
    const textData = "วันที่: " + d + "\n" +
                     "โทร: " + p + "\n" +
                     "ทะเบียน: " + c + "\n" +
                     "ประเภท: " + t + "\n" +
                     "ขนาด/น้ำหนัก: " + w + "\n" +
                     "จดทะเบียน: " + r + " (อายุ " + a + " ปี)\n\n" +
                     breakdown +
                     "-------------------\n" +
                     totalText + "\n\n" +
                     "🔗 ลิงก์เอกสารรถ:\n" + l;
                     
    document.getElementById('infoText').value = textData;

    function copyToClipboard() {
      const copyText = document.getElementById('infoText');
      copyText.select();
      copyText.setSelectionRange(0, 99999); 
      document.execCommand('copy');
      
      const btn = document.getElementById('copyBtn');
      btn.innerHTML = "✅ คัดลอกสำเร็จ! (ปิดหน้าต่างได้เลย)";
      btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
      btn.classList.add('bg-green-600', 'hover:bg-green-700');
    }
  </script>

</body>
</html>
