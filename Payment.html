<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบรับชำระเงิน</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
      body { font-family: 'Sarabun', sans-serif; background: #f4f6f9; padding: 20px; }
      .card-hover:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.2s; }
      .btn-myshop { color: #06c755; border-color: #06c755; }
      .btn-myshop:hover { background-color: #06c755; color: white; }
  </style>
</head>
<body>

  <div class="container" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
       <h4 class="text-primary fw-bold">💰 ระบบรับชำระเงิน</h4>
       <div class="text-end">
           <span id="staffNameDisplay" class="badge bg-secondary fs-6">ไม่ได้ล็อกอิน</span>
       </div>
    </div>

    <div class="card p-4 shadow-sm mb-3">
       <label class="form-label fw-bold">ค้นหารายการค้างจ่าย</label>
       <div class="input-group">
          <input type="text" id="sk" class="form-control" placeholder="ระบุทะเบียน / เลขคิว / JOB ID">
          <button class="btn btn-primary" onclick="search()">🔍 ค้นหา</button>
       </div>
    </div>
    <div id="resultArea"></div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyzFxHS2LMwdh0d2BvggdBiUMDY79wRQr_xfJLBUzo8RB9XbxPQIWaNe6S8PpvGeAJDmw/exec";
    let currentStaff = "";
    let currentBranch = "";

    window.onload = promptLogin;

    async function promptLogin() {
       const { value: pin } = await Swal.fire({
          title: 'ระบุรหัสพนักงาน (PIN)', input: 'password', allowOutsideClick: false, confirmButtonText: 'เข้าสู่ระบบ'
       });
       if (pin) {
          const res = await (await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: "verifyPin", pin: pin }) })).json();
          if(res.valid) {
             currentStaff = res.name; currentBranch = res.branch;
             document.getElementById('staffNameDisplay').innerHTML = `👤 ${res.name}<br><small>(${res.branch})</small>`;
             document.getElementById('staffNameDisplay').className = "badge bg-success fs-6";
          } else {
             Swal.fire('รหัสไม่ถูกต้อง', '', 'error').then(promptLogin);
          }
       }
    }

    async function search() {
       let k = document.getElementById('sk').value;
       document.getElementById('resultArea').innerHTML = '<div class="text-center mt-3">⏳ กำลังค้นหา...</div>';
       const res = await (await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: "searchBill", keyword: k, branch: currentBranch }) })).json();
       let html = res.length === 0 ? '<div class="alert alert-warning text-center">❌ ไม่พบข้อมูล</div>' : '';
       res.forEach(r => {
          html += `<div class="card mb-3 border-primary shadow-sm card-hover">
                    <div class="card-body">
                       <h5 class="fw-bold text-primary">${r.plate}</h5>
                       <p class="mb-1 text-muted small">JOB: ${r.jobId} | เบอร์: ${r.phone}</p>
                       <h3 class="text-success fw-bold">${parseInt(r.total).toLocaleString()} ฿</h3>
                       <button class="btn btn-success w-100 mt-2" onclick="showPaymentOptions('${r.jobId}', '${r.plate}', ${r.total})">✅ แจ้งรับเงิน</button>
                    </div>
                  </div>`;
       });
       document.getElementById('resultArea').innerHTML = html;
    }

    async function submitToBackend(payload) {
       const res = await (await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: "savePaymentData", ...payload, receiver: currentStaff }) })).json();
       if(res.status === 'success') {
          Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อย', 'success').then(search);
       }
    }
    
    // (ฟังก์ชัน showPaymentOptions และ selectMethod ใช้ logic เดิมแต่เปลี่ยนการเรียกใช้ submitToBackend เป็นแบบข้างบน)
  </script>
</body>
</html>
