<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ใบเสร็จรับเงิน</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f8f9fa; padding: 20px; font-family: sans-serif; }
    .receipt-box { max-width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 0 auto; }
  </style>
</head>
<body>
  <div class="receipt-box">
    <h3 class="text-center text-success fw-bold mb-3">🧾 ใบเสร็จรับเงิน</h3>
    <div class="input-group mb-3">
      <input type="text" id="receiptKeyword" class="form-control" placeholder="กรอกเลข JOB หรือทะเบียนรถ...">
      <button class="btn btn-primary" type="button" onclick="loadReceipt()">ค้นหาใบเสร็จ</button>
    </div>
    <div id="receiptResult" style="display: none;">
      <hr>
      <div class="p-3 bg-light rounded mb-3">
        <p class="mb-1"><strong>เลขที่ Job:</strong> <span id="rJobId">-</span></p>
        <p class="mb-1"><strong>ทะเบียนรถ:</strong> <span id="rReg">-</span></p>
        <p class="mb-1"><strong>ยอดรวมสุทธิ:</strong> <span id="rTotal" class="text-success fw-bold">0.00</span> บาท</p>
      </div>
      <button class="btn btn-outline-success w-100" onclick="window.print()">🖨️ พิมพ์ใบเสร็จ</button>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyzFxHS2LMwdh0d2BvggdBiUMDY79wRQr_xfJLBUzo8RB9XbxPQIWaNe6S8PpvGeAJDmw/exec"; 

    async function loadReceipt() {
      const keyword = document.getElementById('receiptKeyword').value.trim();
      if(!keyword) return Swal.fire('แจ้งเตือน', 'กรุณากรอกคำค้นหา', 'warning');

      try {
        const response = await fetch(GAS_API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "getReceiptData", keyword: keyword })
        });
        const res = await response.json();

        if(res.status === "success" && res.data) {
            document.getElementById('rJobId').innerText = res.data.jobId;
            document.getElementById('rReg').innerText = res.data.reg;
            document.getElementById('rTotal').innerText = Number(res.data.total).toLocaleString();
            document.getElementById('receiptResult').style.display = 'block';
        } else {
            Swal.fire('ไม่พบข้อมูล', 'ไม่พบใบเสร็จ', 'error');
        }
      } catch(e) {
        Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
      }
    }
  </script>
</body>
</html>
