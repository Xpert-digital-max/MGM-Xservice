<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outsource Portal - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .container { background: white; width: 100%; max-width: 500px; border-radius: 10px; padding: 20px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .user-header { text-align: center; margin-bottom: 20px; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
    .task-card { background: #fff; border: 1px solid #e0e0e0; border-left: 5px solid #3498db; border-radius: 6px; padding: 15px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .task-title { font-weight: 600; color: #2c3e50; font-size: 16px; margin-bottom: 5px; }
    .task-detail { font-size: 13px; color: #7f8c8d; margin-bottom: 3px; }
    .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #fef9e7; color: #f39c12; margin-top: 5px;}
    
    input, select, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
    input:focus, select:focus { outline: none; border-color: #3498db; }
    label { font-weight: 600; font-size: 14px; color: #34495e; display: block; margin-bottom: 4px; }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: 'Sarabun', sans-serif; font-size: 15px; transition: 0.3s; }
    .btn-primary { background-color: #27ae60; color: white; }
    .btn-secondary { background-color: #3498db; color: white; margin-bottom: 15px; }
    .btn-outline { background-color: transparent; border: 1px solid #7f8c8d; color: #7f8c8d; margin-top: 10px; }
    
    .search-container { display: flex; gap: 8px; margin-bottom: 15px; }
    .search-container input { margin-bottom: 0; flex: 1; }
    .search-container button { margin-bottom: 0; width: auto; padding: 10px 15px; }
    
    #loadingMsg { text-align: center; color: #3498db; font-weight: bold; padding: 20px 0; display: none; }
    #emptyMsg { text-align: center; color: #7f8c8d; padding: 20px 0; font-size: 14px; }
    .admin-box { background: #fff8e1; border: 1px solid #ffe082; padding: 15px; border-radius: 6px; margin-bottom: 15px; display: none; }
    
    /* สไตล์กล่องโชว์เงิน Outsource */
    .money-badge { display: inline-block; background: #eafaf1; color: #27ae60; font-weight: bold; font-size: 13px; padding: 4px 10px; border-radius: 4px; margin-top: 8px; border: 1px solid #a9dfbf; }
  </style>
</head>
<body>

  <div class="container">
    <div class="user-header">
      <h3 style="margin:0;" id="mainTitle">ระบบจัดการงาน Outsource</h3>
      <p style="margin:5px 0 0 0; font-size:14px; color:#7f8c8d;">👤 <span id="displayName">กำลังเชื่อมต่อ LINE...</span></p>
    </div>

    <!-- 📊 Dashboard -->
    <div id="dashboardView">
      <button class="btn btn-secondary" onclick="openNewForm()">➕ เพิ่มงานใหม่</button>
      
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="ค้นหา ทะเบียน, เบอร์โทร, ลูกค้า..." onkeypress="handleEnter(event)">
        <button class="btn btn-secondary" onclick="executeSearch()">🔍 ค้นหา</button>
      </div>

      <h4 style="color:#2c3e50; margin-bottom: 10px;">📋 รายการงาน:</h4>
      
      <div id="loadingMsg">กำลังค้นหาข้อมูล... ⏳</div>
      <div id="emptyMsg">💡 พิมพ์ข้อมูลที่ต้องการค้นหาแล้วกดปุ่ม "ค้นหา"<br>(หากเว้นว่างไว้ จะแสดงงานทั้งหมด)</div>
      
      <div id="taskList"></div>
    </div>

    <!-- 📝 Form -->
    <div id="formView" style="display: none;">
      <h3 id="formTitle" style="color:#2c3e50; text-align:center; margin-top:0;">เพิ่มงานใหม่</h3>
      
      <form id="outsourceForm" onsubmit="submitForm(event)">
        <input type="hidden" id="userId" name="userId">
        <input type="hidden" id="outsourceName" name="outsourceName">
        <input type="hidden" id="actionType" name="action">       
        <input type="hidden" id="rowIndex" name="rowIndex">       
        <input type="hidden" id="oldFollowUp" name="oldFollowUp"> 

        <label>ทะเบียนรถ</label>
        <input type="text" id="plate" name="plate" required placeholder="เช่น 1ก-9999">

        <label>ชื่อลูกค้า</label>
        <input type="text" id="customerName" name="customerName" required placeholder="ชื่อ-นามสกุล">

        <label>เบอร์โทรศัพท์ลูกค้า</label>
        <input type="text" id="phone" name="phone" required placeholder="08XXXXXXXX">

        <!-- 👑 กล่องแอดมินสำหรับกรอกค่าคอม (โชว์เฉพาะคนที่มี Active ใน Config) -->
        <div id="adminSection" class="admin-box">
          <h4 style="margin-top:0; color:#f39c12;">👑 ส่วนของแอดมิน (ใส่ค่าคอมมิชชั่น)</h4>
          <label>เบี้ยสุทธิ (คำนวณอัตโนมัติจากเบี้ยรวม)</label>
          <input type="text" id="netPremium" name="netPremium" readonly style="background:#f4f6f6;" placeholder="ระบบจะคำนวณให้...">
          
          <label>% คอมมิชชั่น (จาก บ.ประกัน)</label>
          <input type="number" id="commissionPct" name="commissionPct" placeholder="เช่น 15" oninput="calcComm()">
          
          <div style="display:flex; gap:10px;">
            <div style="flex:1;">
              <label>การตลาด 10%</label>
              <input type="text" id="marketingFee" name="marketingFee" readonly style="background:#f4f6f6;">
            </div>
            <div style="flex:1;">
              <label>ส่วนกลาง 10%</label>
              <input type="text" id="centralFee" name="centralFee" readonly style="background:#f4f6f6;">
            </div>
            <div style="flex:1;">
              <label>Outsource 40%</label>
              <input type="text" id="outsourceShare" name="outsourceShare" readonly style="background:#eafaf1; color:#27ae60; font-weight:bold;">
            </div>
          </div>
        </div>

        <label>บริษัทประกัน (ถ้ามี)</label>
        <input type="text" id="insuranceCompany" name="insuranceCompany" placeholder="เช่น วิริยะ, อินทร">

        <label>ประเภทประกัน</label>
        <select id="insuranceType" name="insuranceType" required>
          <option value="" disabled selected>-- เลือกประเภทประกัน --</option>
          <option value="ประเภท 1">ประเภท 1</option>
          <option value="ประเภท 2">ประเภท 2</option>
          <option value="ประเภท 2+">ประเภท 2+</option>
          <option value="ประเภท 3">ประเภท 3</option>
          <option value="ประเภท 3+">ประเภท 3+</option>
          <option value="พ.ร.บ.">พ.ร.บ.</option>
          <option value="ประกันอื่นๆ">ประกันอื่นๆ</option>
        </select>

        <label>สถานะงานปัจจุบัน</label>
        <select id="status" name="status" required>
          <option value="" disabled selected>-- เลือกสถานะ --</option>
          <option value="รอทัก">⏳ ทักเตือนแล้ว (รอติดตาม)</option>
          <option value="เสนอราคา">📝 เสนอราคาแล้ว (รอตัดสินใจ)</option>
          <option value="ปิดการขาย">✅ ปิดการขาย (รอโอนเงิน)</option>
          <option value="ลูกค้าปฏิเสธ">❌ ลูกค้าปฏิเสธ / ทำที่อื่นแล้ว</option>
        </select>

        <label>ยอดเบี้ยรวมภาษี (Gross) - บาท</label>
        <input type="number" id="grossPremium" name="grossPremium" placeholder="ระบุยอดเงิน (ถ้ามี)" oninput="calcComm()">

        <label>วันที่ต้องการให้ระบบแจ้งเตือนกลับ</label>
        <input type="date" id="followUpDate" name="followUpDate">
        <p id="dateHint" style="font-size:12px; color:#e74c3c; margin-top:-10px; display:none;">* วันที่เดิม: <span id="showOldDate"></span> (ถ้าไม่เปลี่ยนให้เว้นว่างไว้)</p>

        <label>ลิงก์แชตลูกค้า (ถ้ามี)</label>
        <input type="url" id="chatLink" name="chatLink" placeholder="วาง URL แชต เช่น https://line.me/...">

        <label>หมายเหตุเพิ่มเติม</label>
        <textarea id="note" name="note" rows="2" placeholder="รายละเอียดอื่นๆ"></textarea>

        <button type="submit" id="btnSubmit" class="btn btn-primary">💾 บันทึกข้อมูลงาน</button>
        <button type="button" class="btn btn-outline" onclick="backToDashboard()">🔙 ยกเลิก / กลับหน้าหลัก</button>
      </form>
    </div>
  </div>

  <script>
    let myTasks = []; 
    let isAdmin = false; 

    fetch(GAS_API_URL + "?action=getSettings")
      .then(response => response.json())
      .then(config => {
          if (!config.OUTSOURCE_LIFF_ID) return alert("ยังไม่ได้ตั้งค่า OUTSOURCE_LIFF_ID");
          initLiff(config.OUTSOURCE_LIFF_ID);
      }).catch(err => console.error(err));

    function initLiff(liffId) {
      liff.init({ liffId: liffId }).then(() => {
          if (liff.isLoggedIn()) {
              liff.getProfile().then(profile => {
                  document.getElementById('userId').value = profile.userId;
                  document.getElementById('outsourceName').value = profile.displayName;
                  document.getElementById('displayName').innerText = profile.displayName;
              });
          } else {
              liff.login();
          }
      });
    }

    function executeSearch() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const userId = document.getElementById('userId').value;
      
      document.getElementById("loadingMsg").style.display = "block";
      document.getElementById("emptyMsg").style.display = "none";
      document.getElementById("taskList").innerHTML = "";
      
      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "getMyTasks", userId: userId })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("loadingMsg").style.display = "none";
        
        if(data.status === "success") {
          myTasks = data.data; 
          isAdmin = data.isAdmin; 
          
          if(isAdmin) {
             document.getElementById("mainTitle").innerText = "👑 แดชบอร์ดผู้ดูแลระบบ";
          }
          
          let filteredTasks = myTasks;
          if (keyword !== "") {
            filteredTasks = myTasks.filter(task => {
              return String(task.plate).toLowerCase().includes(keyword) || 
                     String(task.customerName).toLowerCase().includes(keyword) || 
                     String(task.phone).toLowerCase().includes(keyword);
            });
          }
          
          renderTasks(filteredTasks);
        }
      });
    }

    function calcComm() {
      let gross = parseFloat(document.getElementById('grossPremium').value) || 0;
      let net = gross > 0 ? (gross / 1.07428) : 0;
      document.getElementById('netPremium').value = net > 0 ? net.toFixed(2) : "";

      let pct = parseFloat(document.getElementById('commissionPct').value) || 0;
      let totalComm = net * (pct / 100);
      
      document.getElementById('marketingFee').value = totalComm > 0 ? (totalComm * 0.10).toFixed(2) : "";
      document.getElementById('centralFee').value = totalComm > 0 ? (totalComm * 0.10).toFixed(2) : "";
      document.getElementById('outsourceShare').value = totalComm > 0 ? (totalComm * 0.40).toFixed(2) : "";
    }

    function handleEnter(event) {
      if (event.key === "Enter") { event.preventDefault(); executeSearch(); }
    }

    function renderTasks(tasks) {
      const listDiv = document.getElementById("taskList");
      const emptyMsg = document.getElementById("emptyMsg");
      listDiv.innerHTML = ""; 
      
      if(tasks.length === 0) {
        emptyMsg.style.display = "block";
        emptyMsg.innerHTML = "❌ ไม่พบรายการงานที่ตรงกับคำค้นหา";
        return;
      }

      tasks.forEach((task) => {
        let card = document.createElement("div");
        card.className = "task-card";
        const originalIndex = myTasks.indexOf(task);
        card.onclick = () => openEditForm(originalIndex);
        
        let ownerTag = isAdmin ? `<span style="color:#2980b9; font-weight:bold;">[${task.outsourceName}]</span> ` : "";
        let chatIcon = task.chatLink ? ` <span style="font-size:12px;">💬</span>` : "";
        
        // 🌟 แสดงส่วนแบ่งให้ Outsource เห็นถ้ามีข้อมูลการคำนวณแล้ว
        let moneyBadge = "";
        if (task.outsourceShare && task.outsourceShare !== "") {
            moneyBadge = `<br><div class="money-badge">💰 ส่วนแบ่งของคุณ: ${task.outsourceShare} บาท</div>`;
        }

        card.innerHTML = `
          <div class="task-title">🚗 ${task.plate}${chatIcon}</div>
          <div class="task-detail">👤 ${ownerTag}${task.customerName} | 📞 ${task.phone}</div>
          <div class="task-detail">🛡️ ${task.insuranceType || "-"} (${task.insuranceCompany || "-"})</div>
          <div class="status-badge">${task.status}</div>
          ${moneyBadge}
          <div style="font-size:12px; color:#c0392b; margin-top:5px; text-align:right;">⏰ นัดเตือน: ${task.followUpDate}</div>
        `;
        listDiv.appendChild(card);
      });
    }

    function openNewForm() {
      document.getElementById("outsourceForm").reset(); 
      document.getElementById("actionType").value = "saveOutsourceData"; 
      
      document.getElementById("plate").readOnly = false;
      document.getElementById("customerName").readOnly = false;
      document.getElementById("phone").readOnly = false;
      document.getElementById("followUpDate").required = true;
      document.getElementById("dateHint").style.display = "none";
      
      document.getElementById("adminSection").style.display = "none";
      disableAdminInputs(true);

      document.getElementById("formTitle").innerText = "➕ เพิ่มงานใหม่";
      toggleView('form');
    }

    function openEditForm(arrayIndex) {
      const task = myTasks[arrayIndex];
      document.getElementById("outsourceForm").reset();
      
      document.getElementById("actionType").value = "updateOutsourceData"; 
      document.getElementById("rowIndex").value = task.rowIndex; 
      document.getElementById("oldFollowUp").value = task.followUpDate;
      
      document.getElementById("plate").value = task.plate;
      document.getElementById("customerName").value = task.customerName;
      document.getElementById("phone").value = task.phone;
      document.getElementById("insuranceCompany").value = task.insuranceCompany;
      document.getElementById("insuranceType").value = task.insuranceType;
      document.getElementById("grossPremium").value = task.grossPremium;
      document.getElementById("status").value = task.status;
      document.getElementById("chatLink").value = task.chatLink || "";
      document.getElementById("note").value = task.note;

      document.getElementById("plate").readOnly = true;
      document.getElementById("customerName").readOnly = true;
      document.getElementById("phone").readOnly = true;
      
      document.getElementById("followUpDate").required = false;
      document.getElementById("dateHint").style.display = "block";
      document.getElementById("showOldDate").innerText = task.followUpDate;

      // ถ้ามีสิทธิ์ แอดมิน ให้แสดงกล่องกรอกค่าคอม
      if (isAdmin) {
        document.getElementById("adminSection").style.display = "block";
        disableAdminInputs(false);
        document.getElementById("netPremium").value = task.netPremium;
        document.getElementById("commissionPct").value = task.commissionPct;
        document.getElementById("marketingFee").value = task.marketingFee;
        document.getElementById("centralFee").value = task.centralFee;
        document.getElementById("outsourceShare").value = task.outsourceShare;
      } else {
        document.getElementById("adminSection").style.display = "none";
        disableAdminInputs(true);
      }

      document.getElementById("formTitle").innerText = "✏️ อัปเดตสถานะงาน";
      toggleView('form');
    }

    function disableAdminInputs(isDisable) {
        document.getElementById("netPremium").disabled = isDisable;
        document.getElementById("commissionPct").disabled = isDisable;
        document.getElementById("marketingFee").disabled = isDisable;
        document.getElementById("centralFee").disabled = isDisable;
        document.getElementById("outsourceShare").disabled = isDisable;
    }

    function submitForm(event) {
      event.preventDefault();
      var btn = document.getElementById("btnSubmit");
      btn.innerText = "กำลังบันทึก... ⏳";
      btn.disabled = true;

      var formData = new FormData(document.getElementById("outsourceForm"));
      var dataObj = {};
      formData.forEach((value, key) => { dataObj[key] = value; });

      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(dataObj)
      })
      .then(response => response.json())
      .then(data => {
        if(data.status === "success") {
            alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
            btn.innerText = "💾 บันทึกข้อมูลงาน";
            btn.disabled = false;
            backToDashboard();
            executeSearch(); 
        } else {
            alert("เกิดข้อผิดพลาด: " + data.message);
            btn.innerText = "💾 บันทึกข้อมูลงาน";
            btn.disabled = false;
        }
      });
    }

    function toggleView(view) {
      if(view === 'form') {
        document.getElementById("dashboardView").style.display = "none";
        document.getElementById("formView").style.display = "block";
        window.scrollTo(0, 0);
      } else {
        document.getElementById("dashboardView").style.display = "block";
        document.getElementById("formView").style.display = "none";
      }
    }
    
    function backToDashboard() { toggleView('dashboard'); }
  </script>
</body>
</html>
