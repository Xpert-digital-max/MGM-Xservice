<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แผนกรับรถ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body{background-color:#e3f2fd;padding:20px;font-family:sans-serif;}
    .file-preview{font-size:0.85rem;color:#666;margin-top:5px;}
    .file-item{display:flex;justify-content:space-between;align-items:center;padding:5px;background:#f8f9fa;border-radius:4px;margin-bottom:5px;}
    .btn-camera { background-color: #ffc107; color: #000; border: none; font-weight: bold; }
    .btn-gallery { background-color: #6c757d; color: #fff; border: none; }
    #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  
  <div id="loadingOverlay">
      <div class="spinner-border text-primary" role="status"></div>
      <div class="mt-2 fw-bold text-primary">กำลังประมวลผลรูปภาพ...</div>
  </div>

  <div class="container" style="max-width:450px;">
    <div class="card p-4 shadow-sm" id="box">
      <h3 class="text-center text-primary fw-bold">🚗 แผนกรับรถ</h3>
      <hr>
      <div id="ui">

        <label class="fw-bold text-danger">สาขาที่รับรถ</label>
        <select id="branch" class="form-select mb-3 border-danger">
          <option value="สาขาพระยืน">สาขาพระยืน</option>
          <option value="สาขาท่าใหม่">สาขาท่าใหม่</option>
        </select>

        <label class="fw-bold">ทะเบียนรถ</label>
        <input type="text" id="reg" class="form-control mb-3" placeholder="เช่น กข 1234">
        
        <label class="fw-bold">เบอร์โทรลูกค้า</label>
        <input type="tel" id="phone" class="form-control mb-3" placeholder="08xxxxxxxx">
        
        <label class="fw-bold">ประเภทรถ</label>
        <select id="carType" class="form-select mb-3">
          <option value="รถเก๋ง">รถเก๋ง</option>
          <option value="รถกระบะ">รถกระบะ</option>
          <option value="4ประตู">4ประตู</option>
          <option value="รถตู้">รถตู้</option>
          <option value="รถจักรยานยนต์">รถจักรยานยนต์</option>
          <option value="รถอื่นๆ">รถอื่นๆ</option>
        </select>
        
        <label class="fw-bold mb-2">หลักฐาน/รูปถ่าย (สูงสุด 3 ไฟล์)</label>
        <div class="row g-2 mb-3">
            <div class="col-6">
                <label class="btn btn-camera w-100 py-3 shadow-sm">
                    📸 ถ่ายรูปรถ
                    <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleFileSelect(this)">
                </label>
            </div>
            <div class="col-6">
                <label class="btn btn-gallery w-100 py-3 shadow-sm">
                    📂 เลือกรูปเก่า
                    <input type="file" accept="image/*" multiple style="display:none;" onchange="handleFileSelect(this)">
                </label>
            </div>
        </div>

        <div id="fileList" class="file-preview mb-3"></div>
        <button type="button" class="btn btn-primary w-100 py-3 fw-bold shadow" onclick="sendData()">ออกบัตรคิว</button>
      </div>
      
      <!-- หน้าจอแสดงผลหลังบันทึกสำเร็จ -->
      <div id="res" class="text-center" style="display:none;">
        <h3 class="text-success fw-bold">✅ บันทึกสำเร็จ!</h3>
        <h1 class="display-1 fw-bold text-primary" id="qNum">0</h1>
        <p class="text-muted">JOB: <span id="jId"></span></p>
        
        <div class="card p-3 my-3 shadow-sm bg-white" style="border: 2px dashed #1DB446;">
            <h5 class="fw-bold mb-1" style="color: #1DB446;">🎁 สิทธิพิเศษสำหรับคุณ!</h5>
            <p class="small text-muted mb-2">สแกนรับสิทธิ์ Premium Member<br>และรับพอยท์สะสมพิเศษทันที</p>
            <img id="qrImage" src="" style="width: 200px; height: 200px; margin: 0 auto; display: block;">
            <p class="small text-muted mt-2 mb-0">(ระบบจะดึงข้อมูลรถของท่านโดยอัตโนมัติ)</p>
        </div>

        <button class="btn btn-outline-secondary w-100" onclick="resetForm()">รับคันต่อไป</button>
      </div>
    </div>
  </div>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // 🌟 ใส่ URL ของ Google Apps Script Web App ที่ลงท้ายด้วย /exec ตรงนี้
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyzFxHS2LMwdh0d2BvggdBiUMDY79wRQr_xfJLBUzo8RB9XbxPQIWaNe6S8PpvGeAJDmw/exec"; 
    let processedFiles = []; 

    window.onload = function() {
       liff.init({ liffId: "2000218686-kY7ah48L" }).catch(e => console.log(e));
    };

    async function handleFileSelect(input) {
      if (input.files && input.files.length > 0) {
         document.getElementById('loadingOverlay').style.display = 'flex'; 
         let newFiles = Array.from(input.files);
         if (processedFiles.length + newFiles.length > 3) {
             alert('อัพโหลดได้สูงสุด 3 ไฟล์ (รวมกัน)');
             input.value = ''; 
             document.getElementById('loadingOverlay').style.display = 'none';
             return;
         }
         for (let file of newFiles) {
             try {
                 let compressedData = await compressImage(file);
                 processedFiles.push(compressedData);
             } catch (err) {
                 console.error(err);
                 alert('ไม่สามารถประมวลผลไฟล์: ' + file.name);
             }
         }
         updateFileList();
         input.value = ''; 
         document.getElementById('loadingOverlay').style.display = 'none'; 
      }
    }
    
    function compressImage(file) {
        return new Promise((resolve, reject) => {
            if (!file.type.match(/image.*/)) {
                let reader = new FileReader();
                reader.onload = (e) => resolve({ name: file.name, type: file.type, data: e.target.result.split(',')[1] });
                reader.onerror = reject;
                reader.readAsDataURL(file);
                return;
            }
            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                let img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 1000; const MAX_HEIGHT = 1000;
                    let width = img.width; let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    let dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    resolve({ name: file.name, type: 'image/jpeg', data: dataUrl.split(',')[1] });
                }
                img.onerror = reject;
            }
            reader.onerror = reject;
        });
    }

    function updateFileList() {
      const list = document.getElementById('fileList'); list.innerHTML = '';
      if(processedFiles.length === 0) {
          list.innerHTML = '<div class="text-center text-muted small">- ยังไม่มีไฟล์แนบ -</div>'; return;
      }
      processedFiles.forEach((file, index) => {
        list.innerHTML += `<div class="file-item"><span>📎 ${file.name}</span><button class="btn btn-danger btn-sm" onclick="removeFile(${index})">x</button></div>`;
      });
    }
    
    function removeFile(index) { processedFiles.splice(index, 1); updateFileList(); }
    
    async function sendData() {
      const branch = document.getElementById('branch').value;
      const reg = document.getElementById('reg').value;
      const phone = document.getElementById('phone').value;
      const carType = document.getElementById('carType').value;
      
      if(!reg || !phone) return Swal.fire('ข้อมูลไม่ครบ','กรุณากรอก ทะเบียน และ เบอร์โทร','warning');
      
      const btn = document.querySelector('#ui button.btn-primary');
      btn.disabled = true; btn.innerText = "⏳ กำลังบันทึก...";
      
      try {
          const payload = {
              action: "saveQueue",
              branch: branch,
              reg: reg,
              phone: phone,
              carType: carType,
              files: processedFiles
          };

          const response = await fetch(GAS_API_URL, {
              method: 'POST',
              body: JSON.stringify(payload)
          });

          const r = await response.json();

          if(r.status === "success") {
              document.getElementById('ui').style.display = 'none';
              document.getElementById('res').style.display = 'block';
              document.getElementById('qNum').innerText = r.queueNo;
              document.getElementById('jId').innerText = r.jobID;

              let liffMemberId = "2000218686-kY7ah48L"; // LIFF ID สำหรับสแกนรับสิทธิ์
              let targetUrl = "https://liff.line.me/" + liffMemberId;
              let qrApi = "https://quickchart.io/qr?size=250&margin=1&text=" + encodeURIComponent(targetUrl);
              document.getElementById('qrImage').src = qrApi;
          } else {
              throw new Error(r.message || "Unknown error");
          }

      } catch(e) {
          Swal.fire('Error', 'เกิดข้อผิดพลาด: ' + e, 'error');
          btn.disabled = false; btn.innerText = "ออกบัตรคิว";
      }
    }
    
    function resetForm() {
       document.getElementById('reg').value = ''; document.getElementById('phone').value = '';
       processedFiles = []; updateFileList();
       document.getElementById('res').style.display = 'none'; document.getElementById('ui').style.display = 'block';
       const btn = document.querySelector('#ui button.btn-primary'); btn.disabled = false; btn.innerText = "ออกบัตรคิว";
    }
  </script>
</body>
</html>
