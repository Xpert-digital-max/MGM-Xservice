<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- 🌟 ดึงค่า URL กลางจาก config.js -->
  <script src="config.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body { font-family:sans-serif; background:#eef2f7; display:flex; justify-content:center; align-items:center; min-height:100vh; padding: 20px; }
    .card-result { background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 25px; margin-top: 0; width: 100%; max-width: 400px; }
    
    .status-badge { padding: 10px 20px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; display: inline-block; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .status-working { background-color: #ffc107; color: #000; } 
    .status-problem { background-color: #dc3545; color: #fff; } 
    .status-done { background-color: #198754; color: #fff; }    
    .status-general { background-color: #0dcaf0; color: #fff; } 
  </style>
</head>
<body>
  <div style="width: 100%; max-width: 400px;">
     
     <!-- ซ่อนฟอร์มค้นหาไว้ก่อนจนกว่าจะเช็คระบบเสร็จ -->
     <div id="searchForm" class="card p-4 shadow-lg text-center" style="border-radius: 20px; display: none;">
        <h3 class="text-primary fw-bold mb-3">🔍 ติดตามสถานะ</h3>
        
        <div class="mb-3 text-start">
            <label class="form-label small text-muted">ทะเบียน หรือ JOB ID</label>
            <input type="text" id="sk" class="form-control form-control-lg" placeholder="ระบุข้อมูล...">
        </div>
        <div class="mb-4 text-start">
            <label class="form-label small text-muted">เบอร์โทรศัพท์</label>
            <input type="tel" id="ph" class="form-control form-control-lg" placeholder="08xxxxxxxx">
        </div>
        
        <button id="btnTrack" class="btn btn-primary w-100 py-2 fw-bold rounded-pill" onclick="track()">ตรวจสอบ</button>
     </div>

     <div id="res" class="card-result" style="display:none;">
        <div class="text-center mb-2">
            <h3 id="vReg" class="fw-bold text-primary mb-1"></h3> <span id="vType" class="badge bg-secondary rounded-pill" style="font-size: 0.8rem;"></span>
        </div>
        <p id="vJob" class="text-center text-muted small mb-4"></p>
        
        <div class="text-center mb-4">
            <div class="text-muted mb-2">สถานะปัจจุบัน:</div>
            <div id="vStatus" class="status-badge"></div>
        </div>
        
        <div class="mb-3">
            <span class="text-muted d-block mb-1 fw-bold">รายการที่ทำ:</span>
            <div id="vList" class="text-end text-dark bg-light p-3 rounded" style="font-size:0.95rem; line-height: 1.6;"></div>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
            <span class="fw-bold text-secondary">ยอดเงินรวม:</span>
            <strong id="vTotal" class="text-danger" style="font-size: 1.8rem;"></strong> 
        </div>

        <div id="receiptSection" class="mt-3 text-center" style="display:none;">
            <button onclick="openReceipt()" class="btn btn-success w-100 rounded-pill py-2">
                <i class="fas fa-file-invoice"></i> ดูใบรับฝากเงิน
            </button>
        </div>

        <div class="mt-4 pt-3 border-top text-center">
            <div class="row g-2">
                <div class="col-6">
                     <button onclick="checkAutoTrack(liffProfile.userId)" class="btn btn-outline-primary w-100 rounded-pill"><i class="fas fa-sync-alt"></i> อัปเดต</button>
                </div>
                <div class="col-6">
                     <button onclick="resetSearch()" class="btn btn-outline-secondary w-100 rounded-pill"><i class="fas fa-search"></i> ค้นหาใหม่</button>
                </div>
            </div>
        </div>
     </div>
  </div>

  <script>
  var receiptUrl = "";
  var liffProfile = null;
  var isDataLoaded = false; 
  var failsafeTimer;

  window.onload = function() {
        initializeLiff();
  };

  async function initializeLiff() {
      Swal.fire({title: 'กำลังตรวจสอบข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
      
      failsafeTimer = setTimeout(() => {
          if (!isDataLoaded) {
              Swal.close();
              checkUrlParamsAndShowForm();
          }
      }, 12000); // เผื่อเวลาเน็ตช้าเป็น 12 วิ

      try {
          await liff.init({ liffId: "2000218686-kY7ah48L" }); // แก้ LIFF ID ของคุณตามจริง
          if (!liff.isLoggedIn()) {
              liff.login();
              return;
          }
          
          liffProfile = await liff.getProfile();
          checkAutoTrack(liffProfile.userId); 
          
      } catch (err) {
          isDataLoaded = true;
          clearTimeout(failsafeTimer);
          Swal.close();
          checkUrlParamsAndShowForm();
      }
  }

  function checkUrlParamsAndShowForm() {
      Swal.close(); 
      const urlParams = new URLSearchParams(window.location.search);
      const idParam = urlParams.get('id'); 
      document.getElementById('res').style.display = 'none';
      document.getElementById('searchForm').style.display = 'block';
      if(idParam) {
          document.getElementById('sk').value = idParam;
          document.getElementById('ph').focus();
      }
  }

  async function checkAutoTrack(userId) {
      try {
          const response = await fetch(GAS_API_URL, {
              method: 'POST',
              body: JSON.stringify({ action: "autoTrackByUserId", userId: userId })
          });
          const res = await response.json();

          isDataLoaded = true;
          clearTimeout(failsafeTimer);
          Swal.close();
          
          if(res && res.found) {
              if(res.expired) {
                  Swal.fire({
                      icon: 'warning',
                      title: 'ข้อมูลเกิน 15 วัน',
                      text: 'ระบบแสดงสถานะย้อนหลังได้ไม่เกิน 15 วันครับ หากต้องการสอบถามข้อมูลเพิ่มเติม รบกวนติดต่อทางแชตครับ',
                      confirmButtonText: 'รับทราบ'
                  }).then(() => {
                      checkUrlParamsAndShowForm();
                  });
              } else {
                  renderResult(res); 
              }
          } else {
              if(res && res.error) console.log("System Log:", res.error);
              checkUrlParamsAndShowForm();
          }
      } catch (err) {
          isDataLoaded = true;
          clearTimeout(failsafeTimer);
          Swal.close();
          checkUrlParamsAndShowForm();
      }
  }

  async function track() {
     let k = document.getElementById('sk').value;
     let p = document.getElementById('ph').value;
     
     if(!k || !p) return Swal.fire('','กรุณาระบุทั้งทะเบียนและเบอร์โทร','warning');
     
     let btn = document.getElementById('btnTrack');
     let originalText = btn.innerText;
     btn.innerText = "⏳ กำลังค้นหา..."; btn.disabled = true;
     
     document.getElementById('res').style.display = 'none';
     document.getElementById('receiptSection').style.display = 'none';

     try {
         const response = await fetch(GAS_API_URL, {
             method: 'POST',
             body: JSON.stringify({ action: "trackCustomerJob", keyword: k, phone: p })
         });
         const res = await response.json();

         btn.innerText = originalText; btn.disabled = false;
         if(res.found) {
             renderResult(res);
             if (liffProfile && res.jobId) {
                 await fetch(GAS_API_URL, {
                     method: 'POST',
                     body: JSON.stringify({ action: "saveLineUserId", jobId: res.jobId, userId: liffProfile.userId, displayName: liffProfile.displayName })
                 });
             }
         } else {
             Swal.fire({icon: 'error', title: 'ไม่พบข้อมูล', text: 'ข้อมูลไม่ถูกต้อง หรือเบอร์โทรไม่ตรงกับที่ลงทะเบียนไว้'});
         }
     } catch (err) {
         btn.innerText = originalText; btn.disabled = false;
         Swal.fire('Error', err.message, 'error');
     }
  }

  function renderResult(res) {
      document.getElementById('searchForm').style.display = 'none';
      document.getElementById('res').style.display = 'block';

      document.getElementById('vReg').innerText = res.reg;
      document.getElementById('vType').innerText = res.carType; 
      document.getElementById('vJob').innerText = "JOB: " + res.jobId;
      
      let stBadge = document.getElementById('vStatus');
      let statusText = String(res.status || "").trim();
      stBadge.className = "status-badge";
      let icon = "";

      if (statusText.includes("กำลังดำเนินการ")) {
          stBadge.classList.add("status-working");
          icon = '<i class="fas fa-shipping-fast"></i> ';
      } else if (statusText.includes("ติดปัญหา")) {
          stBadge.classList.add("status-problem");
          icon = '<i class="fas fa-exclamation-triangle"></i> ';
      } else if (statusText.includes("เสร็จ") || statusText.includes("เรียบร้อย") || statusText.includes("รับเล่ม")) {
          stBadge.classList.add("status-done");
          icon = '<i class="fas fa-check-circle"></i> ';
      } else {
          stBadge.classList.add("status-general"); 
          icon = '<i class="fas fa-info-circle"></i> ';
      }
      stBadge.innerHTML = icon + statusText;

      if(res.serviceList && res.serviceList.length > 0) {
          document.getElementById('vList').innerHTML = res.serviceList.map(item => `<div>- ${item}</div>`).join("");
      } else {
          document.getElementById('vList').innerText = "-";
      }
      document.getElementById('vTotal').innerText = res.total.toLocaleString() + " บาท";

      if(res.pdfUrl) {
          receiptUrl = res.pdfUrl;
          document.getElementById('receiptSection').style.display = 'block';
      } else {
          document.getElementById('receiptSection').style.display = 'none';
      }
  }

  function resetSearch() {
      document.getElementById('res').style.display = 'none'; 
      document.getElementById('searchForm').style.display = 'block'; 
      document.getElementById('sk').value = '';
      document.getElementById('ph').value = '';
  }

  function openReceipt() {
      if(receiptUrl) { window.open(receiptUrl, '_blank'); }
  }
  </script>
</body>
</html>
