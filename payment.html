<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- ดึงค่า URL กลางจาก config.js -->
  <script src="config.js"></script>
  <style>
      body { font-family: 'Sarabun', sans-serif; background: #f4f6f9; padding: 20px; }
      .card-hover:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.2s; }
      .btn-myshop { color: #06c755; border-color: #06c755; }
      .btn-myshop:hover { background-color: #06c755; color: white; }
  </style>
</head>
<body>

  <div class="container" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
       <h4 class="text-primary fw-bold">💰 ระบบรับชำระเงิน</h4>
       <div class="text-end">
           <span id="staffNameDisplay" class="badge bg-secondary fs-6">ไม่ได้ล็อกอิน</span>
       </div>
    </div>

    <div class="card p-4 shadow-sm mb-3">
       <label class="form-label fw-bold">ค้นหารายการค้างจ่าย</label>
       <div class="input-group">
          <input type="text" id="sk" class="form-control" placeholder="ระบุทะเบียน / เลขคิว / JOB ID">
          <button class="btn btn-primary" onclick="search()">🔍 ค้นหา</button>
       </div>
    </div>

    <div id="resultArea"></div>
  </div>

  <script>
    var currentStaff = "";
    var currentBranch = ""; 
    var tempPayData = {}; 

    window.onload = function() { 
        promptLogin(); 
    };

    // 1. ฟังก์ชันล็อกอิน (ปรับใช้ fetch)
    async function promptLogin() {
       const { value: pin } = await Swal.fire({
          title: 'ระบุรหัสพนักงาน (PIN)',
          input: 'password',
          allowOutsideClick: false,
          confirmButtonText: 'เข้าสู่ระบบ'
       });

       if (pin) {
          try {
              const response = await fetch(GAS_API_URL, {
                  method: 'POST',
                  body: JSON.stringify({ action: "verifyPin", pin: pin })
              });
              const res = await response.json();

              if(res.valid) {
                 currentStaff = res.name;
                 currentBranch = res.branch || "สาขาหลัก";
                 
                 document.getElementById('staffNameDisplay').innerHTML = `👤 ${currentStaff} <br><small class="text-light">(${currentBranch})</small>`;
                 document.getElementById('staffNameDisplay').className = "badge bg-success fs-6";
              } else {
                 Swal.fire('รหัสไม่ถูกต้อง', '', 'error').then(promptLogin);
              }
          } catch(e) {
              Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้', 'error').then(promptLogin);
          }
       }
    }

    // 2. ฟังก์ชันค้นหา (ปรับใช้ fetch)
    async function search() {
       let k = document.getElementById('sk').value;
       document.getElementById('resultArea').innerHTML = '<div class="text-center mt-3">⏳ กำลังค้นหา...</div>';
       
       try {
           const response = await fetch(GAS_API_URL, {
               method: 'POST',
               body: JSON.stringify({ action: "searchBill", keyword: k, branch: currentBranch })
           });
           const results = await response.json();

           let html = "";
           if(!results || results.length === 0) {
              html = '<div class="alert alert-warning text-center">❌ ไม่พบยอดค้างชำระของสาขานี้ (หรือข้อมูลไม่ถูกต้อง)</div>';
           } else {
              results.forEach(r => {
                 html += `
                   <div class="card mb-3 border-primary shadow-sm card-hover">
                     <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h5 class="fw-bold text-primary">${r.plate}</h5>
                            <span class="badge bg-warning text-dark">รอชำระ</span>
                        </div>
                        <p class="mb-1 text-muted small">JOB ID: ${r.jobId} | เบอร์: ${r.phone}</p>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-muted">ยอดที่ต้องชำระ</span>
                            <h3 class="text-success fw-bold m-0">${parseInt(r.total).toLocaleString()} ฿</h3>
                        </div>
                        <button class="btn btn-success w-100 mt-3 py-2 fw-bold" 
                          onclick="showPaymentOptions('${r.jobId}', '${r.plate}', ${r.total})">
                          ✅ แจ้งโอน / รับเงิน
                        </button>
                     </div>
                   </div>
                 `;
              });
           }
           document.getElementById('resultArea').innerHTML = html;
       } catch(e) {
           document.getElementById('resultArea').innerHTML = '<div class="alert alert-danger text-center">❌ เกิดข้อผิดพลาดในการเชื่อมต่อ</div>';
       }
    }

    // 3. ฟังก์ชันแสดงตัวเลือกการชำระเงิน
    function showPaymentOptions(jobId, plate, amount) {
       tempPayData = { jobId, plate, amount };

       Swal.fire({
          title: 'เลือกช่องทางชำระเงิน',
          text: `ยอดรวม ${amount.toLocaleString()} บาท`,
          html: `
            <div class="d-grid gap-2 mt-2">
              <button class="btn btn-outline-success" onclick="selectMethod('เงินสด')">💵 เงินสด</button>
              <button class="btn btn-outline-info" onclick="selectMethod('เงินโอน')">📲 เงินโอน (แนบลิงก์สลิป)</button>
              <button class="btn btn-outline-primary" onclick="selectMethod('บัตรเครดิต')">💳 บัตรเครดิต</button>
              <button class="btn btn-myshop" onclick="selectMethod('LINE Myshop')">🛍️ LINE Myshop</button>
              <button class="btn btn-outline-danger" onclick="selectMethod('ค้างชำระ')">⚠️ ค้างชำระ</button>
            </div>
          `,
          showConfirmButton: false, 
          showCloseButton: true
       });
    }

    // 4. ฟังก์ชันจัดการเมื่อเลือกช่องทางชำระเงิน
    async function selectMethod(method) {
       Swal.close(); 
       let { jobId, amount } = tempPayData;

       if (method === 'เงินโอน') {
          const { value: slipLink } = await Swal.fire({
             title: 'กรุณาวางลิงก์สลิป',
             input: 'text',
             inputPlaceholder: 'https://...',
             html: `<div class="text-danger small mt-2">* ยอด ${amount.toLocaleString()} บาท</div>`,
             showCancelButton: true,
             confirmButtonText: 'ยืนยันการโอน',
             inputValidator: (value) => {
                if (!value || value.trim() === "") {
                   return 'คุณต้องวางลิงก์สลิปก่อนยืนยัน!';
                }
             }
          });

          if (slipLink) {
             submitToBackend(jobId, method, amount, slipLink.trim(), "link");
          }
       } 
       else {
          Swal.fire({
             title: `ยืนยันรับชำระ?`,
             text: `ช่องทาง: ${method} | ยอด: ${amount.toLocaleString()} บาท`,
             icon: 'question',
             showCancelButton: true,
             confirmButtonText: 'ยืนยัน'
          }).then((r) => {
             if(r.isConfirmed) {
                submitToBackend(jobId, method, amount, "", ""); 
             }
          });
       }
    }

    // 5. ส่งข้อมูลไปยัง Google Apps Script (ปรับใช้ fetch)
    async function submitToBackend(jobId, method, amount, linkData, mimeType) {
       if (!currentStaff || currentStaff === "") {
           return Swal.fire('ผิดพลาด', 'ไม่พบข้อมูลพนักงาน! กรุณารีเฟรชหน้าแล้ว Login ใหม่', 'error');
       }

       Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

       let payload = {
          action: "savePaymentData",
          jobId: jobId,
          amount: amount,
          paymentMethod: method,
          receiver: currentStaff, 
          image: linkData,   
          mimeType: mimeType      
       };

       try {
           const response = await fetch(GAS_API_URL, {
               method: 'POST',
               body: JSON.stringify(payload)
           });
           const res = await response.json();

           if(res.status === 'success') {
              Swal.fire('เรียบร้อย', 'บันทึกข้อมูลสำเร็จ', 'success').then(() => {
                  search(); 
              });
           } else {
              Swal.fire('เกิดข้อผิดพลาด', res.message || 'ไม่สามารถบันทึกได้', 'error');
           }
       } catch(err) {
           Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบหลังบ้านได้', 'error');
       }
    }
  </script>
</body>
</html>
