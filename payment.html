<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- ดึงค่า URL กลางจาก config.js -->
  <script src="config.js"></script>
  <!-- 🌟 เพิ่มสคริปต์ของ LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
      body { font-family: 'Sarabun', sans-serif; background: #f4f6f9; padding: 20px; }
      .card-hover:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.2s; }
      .btn-myshop { color: #06c755; border-color: #06c755; }
      .btn-myshop:hover { background-color: #06c755; color: white; }
  </style>
</head>
<body>

  <div class="container" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
       <h4 class="text-primary fw-bold">💰 ระบบรับชำระเงิน</h4>
       <div class="text-end">
           <span id="staffNameDisplay" class="badge bg-secondary fs-6">กำลังตรวจสอบสิทธิ์...</span>
       </div>
    </div>

    <!-- 🌟 ซ่อนส่วนการทำงานไว้ก่อน จนกว่าจะตรวจสอบสิทธิ์ผ่าน -->
    <div id="mainContent" style="display: none;">
      <div class="card p-4 shadow-sm mb-3">
         <label class="form-label fw-bold">ค้นหารายการค้างจ่าย</label>
         <div class="input-group">
            <input type="text" id="sk" class="form-control" placeholder="ระบุทะเบียน / เลขคิว / JOB ID">
            <button class="btn btn-primary" onclick="search()">🔍 ค้นหา</button>
         </div>
      </div>
      <div id="resultArea"></div>
    </div>
  </div>

  <script>
    var currentStaff = "";
    var currentBranch = ""; 
    var tempPayData = {}; 

    window.onload = function() { 
        initializeLiff(); 
    };

    // 1. ฟังก์ชันโหลด LIFF และบังคับล็อกอิน
    async function initializeLiff() {
        try {
            // 🌟 เรียกใช้ PAYMENT_LIFF_ID จาก config.js โดยตรง
            await liff.init({ liffId: PAYMENT_LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                verifyLineUser();
            }
        } catch (err) {
            Swal.fire('Error', 'ไม่สามารถโหลดระบบ LINE ได้', 'error');
        }
    }

    // 2. ฟังก์ชันตรวจสอบสิทธิ์ (อัปเกรดแทนการใส่ PIN)
    async function verifyLineUser() {
       Swal.fire({ title: 'กำลังตรวจสอบสิทธิ์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
       try {
           const profile = await liff.getProfile();
           const response = await fetch(GAS_API_URL, {
               method: 'POST',
               body: JSON.stringify({ 
                   action: "verifyUserAccess", 
                   userId: profile.userId,
                   pageName: "payment.html" // 🌟 ส่งชื่อหน้าไปตรวจสอบให้ตรงกับคอลัมน์
               })
           });
           const res = await response.json();

           if(res.valid) {
              Swal.close();
              currentStaff = res.name;
              currentBranch = res.branch;
              
              document.getElementById('staffNameDisplay').innerHTML = `👤 ${currentStaff} <br><small class="text-light">(${currentBranch})</small>`;
              document.getElementById('staffNameDisplay').className = "badge bg-success fs-6";
              
              // 🌟 ปลดล็อกหน้าจอให้ใช้งาน
              document.getElementById('mainContent').style.display = 'block';
           } else {
              Swal.fire('ไม่มีสิทธิ์เข้าถึง', res.message || 'คุณไม่มีสิทธิ์ใช้งานหน้านี้', 'error');
              document.getElementById('staffNameDisplay').innerHTML = `❌ ไม่มีสิทธิ์`;
              document.getElementById('staffNameDisplay').className = "badge bg-danger fs-6";
           }
       } catch(e) {
           Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบหลังบ้านได้', 'error');
       }
    }

    // 3. ฟังก์ชันค้นหา (อัปเดต: ส่งตัวแปร paid มารับค่ามัดจำ)
    async function search() {
       let k = document.getElementById('sk').value;
       document.getElementById('resultArea').innerHTML = '<div class="text-center mt-3">⏳ กำลังค้นหา...</div>';
       
       try {
           const response = await fetch(GAS_API_URL, {
               method: 'POST',
               body: JSON.stringify({ action: "searchBill", keyword: k, branch: currentBranch })
           });
           const results = await response.json();

           let html = "";
           if(!results || results.length === 0) {
              html = '<div class="alert alert-warning text-center shadow-sm">❌ ไม่พบยอดค้างชำระของสาขานี้</div>';
           } else {
              let sumTotal = 0;
              results.forEach(r => sumTotal += r.total);
              
              html += `
                <div class="alert alert-danger text-center shadow-sm mb-4" style="border: 2px dashed #dc3545;">
                   <h5 class="fw-bold mb-2 text-danger">⚠️ ยอดรวมรายการค้างชำระ (${results.length} คัน)</h5>
                   <h2 class="fw-bold text-danger m-0">${sumTotal.toLocaleString()} บาท</h2>
                </div>
              `;

              results.forEach(r => {
                 // 🌟 เช็คว่าถ้ามียอดจ่ายสะสม (paid) แสดงว่าเป็นเคสผ่อน/แบ่งจ่าย ให้เพิ่ม Badge โชว์ด้วย
                 let badgeHtml = (r.paid > 0) ? `<span class="badge bg-primary text-white ms-1">แบ่งจ่าย</span>` : `<span class="badge bg-danger text-white">ค้างชำระ</span>`;

                 html += `
                   <div class="card mb-3 border-danger shadow-sm card-hover">
                     <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h5 class="fw-bold text-primary">${r.plate}</h5>
                            <div>${badgeHtml}</div>
                        </div>
                        <p class="mb-1 text-muted small">JOB ID: ${r.jobId} | เบอร์: ${r.phone}</p>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-muted">ยอดที่ต้องชำระ</span>
                            <h3 class="text-success fw-bold m-0">${parseInt(r.total).toLocaleString()} ฿</h3>
                        </div>
                        <button class="btn btn-success w-100 mt-3 py-2 fw-bold" 
                          onclick="showPaymentOptions('${r.jobId}', '${r.plate}', ${r.total}, ${r.paid})">
                          ✅ แจ้งโอน / รับเงิน
                        </button>
                     </div>
                   </div>
                 `;
              });
           }
           document.getElementById('resultArea').innerHTML = html;
       } catch(e) {
           document.getElementById('resultArea').innerHTML = '<div class="alert alert-danger text-center">❌ เกิดข้อผิดพลาดในการเชื่อมต่อ</div>';
       }
    }

    // 4. ฟังก์ชันแสดงตัวเลือกการชำระเงิน (ลบปุ่มค้างชำระออก + เพิ่มปุ่มแบ่งจ่าย)
    function showPaymentOptions(jobId, plate, amount, paid) {
       tempPayData = { jobId, plate, amount, paid };

       Swal.fire({
          title: 'เลือกช่องทางชำระเงิน',
          text: `ยอดค้างชำระสุทธิ ${amount.toLocaleString()} บาท`,
          html: `
            <div class="d-grid gap-2 mt-3">
              <button class="btn btn-outline-success btn-lg" onclick="selectMethod('เงินสด')">💵 เงินสด (จ่ายเต็ม)</button>
              <button class="btn btn-outline-info btn-lg" onclick="selectMethod('เงินโอน')">📲 เงินโอน (แนบสลิป)</button>
              <button class="btn btn-outline-primary btn-lg" onclick="selectMethod('บัตรเครดิต')">💳 บัตรเครดิต</button>
              <button class="btn btn-myshop btn-lg" onclick="selectMethod('LINE Myshop')">🛍️ LINE Myshop</button>
              <hr>
              <button class="btn btn-warning fw-bold" onclick="selectMethod('แบ่งจ่าย')">✏️ ระบุยอดเงินเอง (แบ่งจ่ายบางส่วน)</button>
            </div>
          `,
          showConfirmButton: false, 
          showCloseButton: true
       });
    }

    // 5. ฟังก์ชันจัดการเมื่อเลือกช่องทางชำระเงิน
    async function selectMethod(method) {
       Swal.close(); 
       let { jobId, amount: remainAmount, paid, plate } = tempPayData;

       let finalAmount = remainAmount; // ค่าตั้งต้นคือยอดเต็ม
       let finalMethod = method;

       // 🌟 ถ้าพนักงานเลือก "แบ่งจ่าย" ให้เด้งกล่องกรอกยอดเงินขึ้นมา
       if (method === 'แบ่งจ่าย' || paid > 0) {
           if (method === 'แบ่งจ่าย') finalMethod = 'เงินโอน'; // ตั้งค่าเริ่มต้นเป็นโอน (พนักงานพิมพ์แก้ได้)

           const { value: formValues, isConfirmed } = await Swal.fire({
              title: 'ระบุยอดที่รับชำระ',
              html: `
                <div class="text-start mb-2"><small class="text-muted">ยอดค้างสุทธิ: ${remainAmount.toLocaleString()} ฿</small></div>
                <input id="swal-input-amt" type="number" class="form-control mb-3" placeholder="ระบุจำนวนเงินที่จ่ายจริง" value="${remainAmount}">
                <select id="swal-input-method" class="form-select">
                    <option value="เงินโอน" ${finalMethod === 'เงินโอน' ? 'selected' : ''}>📲 เงินโอน</option>
                    <option value="เงินสด" ${finalMethod === 'เงินสด' ? 'selected' : ''}>💵 เงินสด</option>
                    <option value="บัตรเครดิต" ${finalMethod === 'บัตรเครดิต' ? 'selected' : ''}>💳 บัตรเครดิต</option>
                </select>
              `,
              focusConfirm: false,
              showCancelButton: true,
              confirmButtonText: 'ถัดไป ➡️',
              cancelButtonText: 'ยกเลิก',
              preConfirm: () => {
                 let amt = document.getElementById('swal-input-amt').value;
                 let mtd = document.getElementById('swal-input-method').value;
                 if (!amt || amt <= 0) { Swal.showValidationMessage('กรุณาระบุจำนวนเงิน!'); return false; }
                 if (amt > remainAmount) { Swal.showValidationMessage('ยอดชำระเกินยอดค้าง!'); return false; }
                 return { amt: parseFloat(amt), mtd: mtd };
              }
           });

           if (!isConfirmed) return showPaymentOptions(jobId, plate, remainAmount, paid);
           
           finalAmount = formValues.amt;
           finalMethod = formValues.mtd;
       }

       // 🌟 ถ้าเป็นเงินโอน ต้องบังคับแนบลิงก์สลิป
       if (finalMethod === 'เงินโอน') {
          const { value: slipLink } = await Swal.fire({
             title: 'กรุณาวางลิงก์สลิป',
             input: 'text',
             inputPlaceholder: 'https://...',
             html: `<div class="text-danger fw-bold mt-2">* ยืนยันรับชำระ: ${finalAmount.toLocaleString()} บาท</div>`,
             showCancelButton: true,
             confirmButtonText: 'ยืนยันการโอน',
             inputValidator: (value) => {
                if (!value || value.trim() === "") return 'คุณต้องวางลิงก์สลิปก่อนยืนยัน!';
             }
          });

          if (slipLink) {
              submitToBackend(jobId, finalMethod, finalAmount, slipLink.trim(), "link");
          }
       } 
       else {
          // 🌟 ถ้าเป็นเงินสด/บัตรเครดิต/Myshop กดปุ๊บ ถามแค่ยืนยัน
          Swal.fire({
             title: `ยืนยันรับชำระ?`,
             text: `ช่องทาง: ${finalMethod} | รับชำระ: ${finalAmount.toLocaleString()} บาท`,
             icon: 'question',
             showCancelButton: true,
             confirmButtonText: '✅ ยืนยันรับเงิน'
          }).then((r) => {
             if(r.isConfirmed) {
                submitToBackend(jobId, finalMethod, finalAmount, "", ""); 
             }
          });
       }
    }

    // 6. ส่งข้อมูลไปยัง Google Apps Script (คงเดิม)
    async function submitToBackend(jobId, method, amount, linkData, mimeType) {
       if (!currentStaff || currentStaff === "") {
           return Swal.fire('ผิดพลาด', 'ไม่พบข้อมูลพนักงาน! กรุณารีเฟรชหน้าแล้ว Login ใหม่', 'error');
       }

       Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

       let payload = {
         action: "savePaymentData",
         jobId: jobId,
         amount: amount,
         paymentMethod: method,
         receiver: currentStaff, 
         image: linkData,   
         mimeType: mimeType      
       };

       try {
           const response = await fetch(GAS_API_URL, {
               method: 'POST',
               body: JSON.stringify(payload)
           });
           const res = await response.json();

           if(res.status === 'success') {
              Swal.fire('เรียบร้อย', 'บันทึกข้อมูลสำเร็จ', 'success').then(() => {
                  search(); 
              });
           } else {
              Swal.fire('เกิดข้อผิดพลาด', res.message || 'ไม่สามารถบันทึกได้', 'error');
           }
       } catch(err) {
           Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบหลังบ้านได้', 'error');
       }
    }
  </script>
</body>
</html>
