<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🚗 แผนกรับรถ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- 🌟 เพิ่มสคริปต์ของ LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- ดึงค่า config กลาง -->
  <script src="config.js"></script>
  <style>
    body{background-color:#e3f2fd;padding:20px;font-family:sans-serif;}
    .file-preview{font-size:0.85rem;color:#666;margin-top:5px;}
    .file-item{display:flex;justify-content:space-between;align-items:center;padding:5px;background:#f8f9fa;border-radius:4px;margin-bottom:5px;}
    .btn-camera { background-color: #ffc107; color: #000; border: none; font-weight: bold; }
    .btn-gallery { background-color: #6c757d; color: #fff; border: none; }
    #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
    #mainContent { display: none; } /* 🌟 ซ่อนไว้ก่อนจนกว่าจะล็อกอินผ่าน */
  </style>
</head>
<body>
  
  <div id="loadingOverlay">
      <div class="spinner-border text-primary" role="status"></div>
      <div class="mt-2 fw-bold text-primary">กำลังประมวลผลรูปภาพ...</div>
  </div>

  <div class="container" style="max-width:450px;">
    
    <!-- 🌟 ส่วนแสดงชื่อพนักงานที่ล็อกอิน -->
    <div class="text-end mb-2">
        <span id="staffNameDisplay" class="badge bg-secondary fs-6 shadow-sm">กำลังตรวจสอบสิทธิ์...</span>
    </div>

    <!-- 🌟 ห่อเนื้อหาทั้งหมดไว้ใน mainContent -->
    <div id="mainContent">
      <div class="card p-4 shadow-sm" id="box">
        <h3 class="text-center text-primary fw-bold">🚗 แผนกรับรถ</h3>
        <hr>
        <div id="ui">



          <label class="fw-bold text-danger">สาขาที่รับรถ</label>
          <select id="branch" class="form-select mb-3 border-danger">
            <option value="สาขาพระยืน">สาขาพระยืน</option>
            <option value="สาขาท่าใหม่">สาขาท่าใหม่</option>
            <option value="All">🌐 ทุกสาขา (แอดมิน)</option>
          </select>
          
          <label class="fw-bold">ทะเบียนรถ</label>
          <input type="text" id="reg" class="form-control mb-3" placeholder="เช่น กข 1234">
          
          <label class="fw-bold">เบอร์โทรลูกค้า</label>
          <input type="tel" id="phone" class="form-control mb-3" placeholder="08xxxxxxxx">
          
          <label class="fw-bold">ประเภทรถ</label>
          <select id="carType" class="form-select mb-3">
            <option value="รถเก๋ง">รถเก๋ง</option>
            <option value="รถกระบะ">รถกระบะ</option>
            <option value="4ประตู">4ประตู</option>
            <option value="รถตู้">รถตู้</option>
            <option value="รถจักรยานยนต์">รถจักรยานยนต์</option>
            <option value="4 ประตู / 3 ตอน ( เกิน 2000 )">4 ประตู / 3 ตอน ( เกิน 2000 )</option>
            <option value="รถอื่นๆ">รถอื่นๆ</option>
          </select>
          
          <label class="fw-bold mb-2">หลักฐาน/รูปถ่าย (สูงสุด 3 ไฟล์)</label>
          
          <div class="row g-2 mb-3">
              <div class="col-6">
                  <label class="btn btn-camera w-100 py-3 shadow-sm">
                      📸 ถ่ายรูปรถ
                      <input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleFileSelect(this)">
                  </label>
              </div>
              <div class="col-6">
                  <label class="btn btn-gallery w-100 py-3 shadow-sm">
                      📂 เลือกรูปเก่า
                      <input type="file" accept="image/*" multiple style="display:none;" onchange="handleFileSelect(this)">
                  </label>
              </div>
          </div>

          <div id="fileList" class="file-preview mb-3"></div>
          
          <button type="button" id="btnSubmitQueue" class="btn btn-primary w-100 py-3 fw-bold shadow" onclick="sendData()">ออกบัตรคิว</button>
          
          <hr class="my-4">
          <!-- 🌟 ส่วนค้นหาคิวเพื่อแก้ไข (ย้ายมาไว้ข้างล่าง) -->
          <div class="input-group">
            <input type="text" id="searchQueue" class="form-control border-primary" placeholder="🔎 ระบุเลขคิว หรือ ทะเบียน เพื่อแก้ไข">
            <button class="btn btn-outline-primary fw-bold" onclick="searchQueueData()">ค้นหา</button>
          </div>
          <div class="text-muted small mt-1 text-center">*ค้นหาและแก้ไขได้เฉพาะคิวของวันนี้เท่านั้น</div>
          
          <!-- 🌟 ซ่อน ID และแถวไว้สำหรับอัปเดต -->
          <input type="hidden" id="editRowIndex" value="">
          <input type="hidden" id="editJobId" value="">
        </div>
        
        <div id="res" class="text-center" style="display:none;">
          <h3 class="text-success fw-bold">✅ บันทึกสำเร็จ!</h3>
          <h1 class="display-1 fw-bold text-primary" id="qNum">0</h1>
          <p class="text-muted">JOB: <span id="jId"></span></p>
          
          <div class="card p-3 my-3 shadow-sm bg-white" style="border: 2px dashed #1DB446;">
              <h5 class="fw-bold mb-1" style="color: #1DB446;">🎁 สิทธิพิเศษสำหรับคุณ!</h5>
              <p class="small text-muted mb-2">สแกนรับสิทธิ์ Premium Member<br>และรับพอยท์สะสมพิเศษทันที</p>
              <img id="qrImage" src="" style="width: 200px; height: 200px; margin: 0 auto; display: block;">
              <p class="small text-muted mt-2 mb-0">(ระบบจะดึงข้อมูลรถของท่านโดยอัตโนมัติ)</p>
          </div>

          <button class="btn btn-outline-secondary w-100" onclick="resetForm()">รับคันต่อไป</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // 🌟 ใส่ LIFF ID 
    const MY_LIFF_ID = "2000218686-sKmiajH7"; 
    
    var currentStaff = "";
    var currentBranch = "";
    let processedFiles = []; 

    window.onload = function() { 
        initLiff(); 
    };

    // 🌟 1. ฟังก์ชันโหลด LIFF และตรวจสอบสิทธิ์
    async function initLiff() {
        try {
            await liff.init({ liffId: MY_LIFF_ID });
            if (!liff.isLoggedIn()) { 
                liff.login(); 
            } else { 
                verifyPermission(); 
            }
        } catch(e) { 
            Swal.fire('Error', 'ไม่สามารถโหลดระบบ LINE ได้', 'error'); 
        }
    }

    async function verifyPermission() {
        Swal.fire({ title: 'กำลังตรวจสอบสิทธิ์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const profile = await liff.getProfile();
        try {
            const response = await fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: "verifyUserAccess", 
                    userId: profile.userId, 
                    pageName: "receiption.html" // 🌟 ส่งชื่อหน้าไปเช็คช่อง D
                })
            });
            const res = await response.json();

            if (res.valid) {
                Swal.close();
                currentStaff = res.name;
                currentBranch = res.branch;
                
                // แสดงชื่อพนักงาน
                document.getElementById('staffNameDisplay').innerHTML = `👤 ${currentStaff} <br><small class="text-light">(${currentBranch})</small>`;
                document.getElementById('staffNameDisplay').className = "badge bg-success fs-6 shadow-sm";
                
                // 🌟 เลื่อนเลือกสาขาให้อัตโนมัติตามสิทธิ์พนักงาน
                let branchSelect = document.getElementById('branch');
                if (currentBranch && currentBranch !== "All") {
                    for (let i = 0; i < branchSelect.options.length; i++) {
                        if (branchSelect.options[i].value === currentBranch) {
                            branchSelect.selectedIndex = i;
                            break;
                        }
                    }
                } else if (currentBranch === "All") {
                    branchSelect.value = "All";
                }
                
                // ปลดล็อกหน้าจอ
                document.getElementById('mainContent').style.display = 'block';
            } else {
                Swal.fire('ไม่มีสิทธิ์เข้าถึง', res.message, 'error');
                document.getElementById('staffNameDisplay').innerText = "❌ ไม่มีสิทธิ์";
                document.getElementById('staffNameDisplay').className = "badge bg-danger fs-6 shadow-sm";
            }
        } catch(e) { 
            Swal.fire('Error', 'เชื่อมต่อระบบไม่ได้', 'error'); 
        }
    }

    // ==========================================
    // ฟังก์ชันเดิม (จัดการรูปภาพ และส่งข้อมูล)
    // ==========================================
    async function handleFileSelect(input) {
      if (input.files && input.files.length > 0) {
         document.getElementById('loadingOverlay').style.display = 'flex'; 
         let newFiles = Array.from(input.files);
         if (processedFiles.length + newFiles.length > 3) {
             alert('อัพโหลดได้สูงสุด 3 ไฟล์ (รวมกัน)');
             input.value = ''; 
             document.getElementById('loadingOverlay').style.display = 'none';
             return;
         }
         for (let file of newFiles) {
             try {
                 let compressedData = await compressImage(file);
                 processedFiles.push(compressedData);
             } catch (err) {
                 console.error(err);
                 alert('ไม่สามารถประมวลผลไฟล์: ' + file.name);
             }
         }
         updateFileList();
         input.value = ''; 
         document.getElementById('loadingOverlay').style.display = 'none'; 
      }
    }
    
    function compressImage(file) {
        return new Promise((resolve, reject) => {
            if (!file.type.match(/image.*/)) {
                let reader = new FileReader();
                reader.onload = (e) => resolve({ name: file.name, type: file.type, data: e.target.result.split(',')[1] });
                reader.onerror = reject;
                reader.readAsDataURL(file);
                return;
            }
            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                let img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                    let width = img.width; let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    let dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                    resolve({ name: file.name, type: 'image/jpeg', data: dataUrl.split(',')[1] });
                }
                img.onerror = reject;
            }
            reader.onerror = reject;
        });
    }

    function updateFileList() {
      const list = document.getElementById('fileList'); list.innerHTML = '';
      if(processedFiles.length === 0) {
          list.innerHTML = '<div class="text-center text-muted small">- ยังไม่มีไฟล์แนบ -</div>'; return;
      }
      processedFiles.forEach((file, index) => {
        list.innerHTML += `<div class="file-item"><span>📎 ${file.name}</span><button class="btn btn-danger btn-sm" onclick="removeFile(${index})">x</button></div>`;
      });
    }

    async function searchQueueData() {
        let keyword = document.getElementById('searchQueue').value.trim();
        if (!keyword) return Swal.fire('แจ้งเตือน', 'กรุณากรอกเลขคิว หรือ ทะเบียน', 'warning');
        
        let branch = document.getElementById('branch').value;
        let btn = document.querySelector('.btn-outline-primary');
        let oldText = btn.innerText;
        btn.innerText = '⏳'; btn.disabled = true;

        try {
            const response = await fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "searchJobData", keyword: keyword, branch: branch, todayOnly: true })
            });
            const res = await response.json();
            btn.innerText = oldText; btn.disabled = false;

            if (!res || !res.found) return Swal.fire('ไม่พบข้อมูล', 'ไม่พบคิวนี้ในสาขาที่เลือก หรือ ไม่ใช่คิวของวันนี้', 'info');

            // 🌟 ดึงคันแรกสุดที่เจอมาใช้งาน
            let job = res.jobs[0];
            
            // 🌟 ตรวจสอบสิทธิ์ที่คอลัมน์ Y ตามที่คุณสั่งไว้เป๊ะๆ
            // ถ้า paymentStatus เป็นค่าว่าง (คือคอลัมน์ Y ว่าง) -> ให้ผ่านไปแก้ได้เลย
            // ถ้า paymentStatus ไม่ว่าง -> ให้บล็อกการแก้ไข
            if (job.paymentStatus !== "") {
                return Swal.fire('ไม่สามารถแก้ไขได้', 'คิวนี้มีการรับชำระเงินเรียบร้อยแล้ว<br><small class="text-danger">(' + job.paymentStatus + ')</small>', 'error');
            }

            // ถ้ารอดมาได้ (คอลัมน์ Y ว่าง) ดึงข้อมูลมาใส่ฟอร์มให้แก้เลย
            document.getElementById('editRowIndex').value = job.rowIndex;
            document.getElementById('editJobId').value = job.jobId;
            document.getElementById('reg').value = job.reg;
            document.getElementById('phone').value = job.phone;
            
            let selType = document.getElementById('carType');
            for(let i=0; i<selType.options.length; i++) {
                if(selType.options[i].value === job.carType) { selType.selectedIndex = i; break; }
            }

            // เปลี่ยนปุ่มเป็นสีเหลืองเพื่อเตือนว่ากำลังแก้ไข
            let saveBtn = document.getElementById('btnSubmitQueue');
            saveBtn.innerText = "💾 บันทึกการแก้ไข";
            saveBtn.className = "btn btn-warning w-100 py-3 fw-bold shadow";
            
            Swal.fire('ดึงข้อมูลสำเร็จ', 'คอลัมน์ Y ว่างเปล่า สามารถแก้ไขข้อมูลได้เลยครับ', 'success');

        } catch (e) {
            btn.innerText = oldText; btn.disabled = false;
            Swal.fire('Error', 'เกิดข้อผิดพลาด: ' + e.message, 'error');
        }
    }
    
    function removeFile(index) { processedFiles.splice(index, 1); updateFileList(); }
    
    async function sendData() {
      const branch = document.getElementById('branch').value;
      const reg = document.getElementById('reg').value;
      const phone = document.getElementById('phone').value;
      const carType = document.getElementById('carType').value;
      
      if(!reg || !phone) return Swal.fire('ข้อมูลไม่ครบ','กรุณากรอก ทะเบียน และ เบอร์โทร','warning');
      
      const btn = document.querySelector('#ui button.btn-primary') || document.querySelector('#btnSubmitQueue');
      btn.disabled = true; btn.innerText = "⏳ กำลังบันทึก...";
      
      let payload = {
          action: "saveQueue",
          branch: branch,
          reg: reg,
          phone: phone,
          carType: carType,
          files: processedFiles,
          editRowIndex: document.getElementById('editRowIndex').value, // 🌟 ส่ง Index ไป (ถ้าเป็นการแก้ไข)
          editJobId: document.getElementById('editJobId').value // 🌟 ส่ง JobID เก่าไป 
      };
      
      try {
          const response = await fetch(GAS_API_URL, {
              method: 'POST',
              body: JSON.stringify(payload)
          });
          const r = await response.json();
          
          if(r.status === "success") {
              document.getElementById('ui').style.display = 'none';
              document.getElementById('res').style.display = 'block';
              document.getElementById('qNum').innerText = r.queueNo;
              document.getElementById('jId').innerText = r.jobID;

              let liffMemberId = "2000218686-kY7ah48L"; // แก้ตาม LIFF ID สมาชิกของคุณ
              let targetUrl = "https://liff.line.me/" + liffMemberId;
              let qrApi = "https://quickchart.io/qr?size=250&margin=1&text=" + encodeURIComponent(targetUrl);
              document.getElementById('qrImage').src = qrApi;
          } else {
              throw new Error("Save failed");
          }
      } catch(e) {
          Swal.fire('Error', 'เกิดข้อผิดพลาด: ' + e, 'error');
          btn.disabled = false; btn.innerText = document.getElementById('editRowIndex').value ? "💾 บันทึกการแก้ไข" : "ออกบัตรคิว";
      }
    }
    
    function resetForm() {
       document.getElementById('reg').value = ''; 
       document.getElementById('phone').value = ''; 
       document.getElementById('searchQueue').value = ''; 
       document.getElementById('editRowIndex').value = ''; 
       document.getElementById('editJobId').value = ''; 
       document.getElementById('btnSubmitQueue').innerText = 'ออกบัตรคิว'; 
       document.getElementById('btnSubmitQueue').className = 'btn btn-primary w-100 py-3 fw-bold shadow';
       processedFiles = []; updateFileList();
       document.getElementById('res').style.display = 'none'; document.getElementById('ui').style.display = 'block';
       const btn = document.getElementById('btnSubmitQueue'); btn.disabled = false;
    }
  </script>
</body>
</html>
